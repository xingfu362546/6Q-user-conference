<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>家庭会议</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="role-bar">
    <button id="role-switcher" class="role-bar__switcher" type="button" aria-haspopup="dialog">
      <span class="role-bar__label">当前角色</span>
      <strong id="current-role-name">未加入家庭</strong>
      <span class="role-bar__chevron" aria-hidden="true">⌄</span>
    </button>
  </header>

  <main id="app">
    <section class="view-panel view-panel--meeting" data-view-panel="meet" hidden></section>
    <section class="view-panel view-panel--review" data-view-panel="review" hidden></section>
    <section class="view-panel" data-view-panel="todos" hidden></section>
    <section class="view-panel view-panel--family" data-view-panel="family"></section>
    <section class="view-panel view-panel--meeting" data-view-panel="meeting-room" hidden></section>
  </main>

  <nav class="tab-bar" aria-label="主导航">
    <button class="tab-bar__item" type="button" data-view="meet">开会</button>
    <button class="tab-bar__item" type="button" data-view="review">回顾</button>
    <button class="tab-bar__item" type="button" data-view="todos">我的待办</button>
    <button class="tab-bar__item is-active" type="button" data-view="family" aria-current="page">我的家庭</button>
  </nav>

  <div id="role-sheet" class="role-sheet" role="dialog" aria-modal="true" aria-labelledby="role-sheet-title" aria-hidden="true" hidden>
    <button id="role-sheet-backdrop" class="role-sheet__backdrop" type="button" aria-label="关闭角色列表"></button>
    <div class="role-sheet__panel">
      <div class="role-sheet__header">
        <h2 id="role-sheet-title">切换角色</h2>
        <button id="role-sheet-close" class="role-sheet__close" type="button" aria-label="关闭">×</button>
      </div>
      <div id="role-list" class="role-sheet__list"></div>
      <section class="role-sheet__settings" aria-label="演示设置">
        <div>
          <strong>演示设置</strong>
          <span>清空当前记录并恢复三口之家</span>
        </div>
        <button id="reset-demo" class="family-button family-button--ghost" type="button">重置演示数据</button>
      </section>
    </div>
  </div>

  <script src="assets/store.js"></script>
  <script src="assets/meeting-types.js"></script>
  <script src="assets/meeting-engine.js"></script>
  <script src="data/demo-seed.js"></script>
  <script src="assets/transcript.js"></script>
  <script src="assets/whiteboard.js"></script>
  <script src="assets/distill.js"></script>
  <script src="assets/consensus.js"></script>
  <script src="assets/todos.js"></script>
  <script src="assets/review.js"></script>
  <script src="assets/family-view.js"></script>
  <script src="assets/meeting-flow.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
