<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>头像换人名 — 呈现预览</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap {
      padding: 24px;
    }
    .grid-cell {
      width: 280px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fafafa;
      overflow: hidden;
    }
    .col-header {
      text-align: center;
      padding: 8px 4px;
      font-size: 15px;
      font-weight: 600;
      color: #7b68ee;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .cell-body {
      padding: 10px;
      background: #f5f5f5;
    }
    .card {
      position: relative;
      background: #d4edda;
      border-radius: 10px;
      padding: 10px 10px 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .status-dot {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 8px;
      height: 8px;
      background: #e53935;
      border-radius: 50%;
    }
    .card-top {
      padding-left: 14px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .badge {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: #2e7d32;
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    .card-title {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: #1b5e20;
      font-weight: 500;
    }
    .meta-bar {
      margin-top: 10px;
      margin-left: -10px;
      margin-right: -10px;
      padding: 8px 10px;
      background: #a5d6a7;
      border-radius: 0 0 10px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      font-size: 12px;
      color: #1b5e20;
    }
    .meta-label {
      font-weight: 700;
      color: #2e7d32;
      margin-right: 2px;
    }
    .name-chip {
      display: inline-flex;
      align-items: center;
      max-width: 72px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.85);
      color: #1b5e20;
      font-size: 11px;
      font-weight: 500;
      border: 1px solid rgba(46,125,50,.25);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-footer {
      text-align: center;
      padding: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #ff8f00;
      background: #fff;
      border-top: 1px solid #eee;
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #666;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid-cell">
      <div class="col-header">休息</div>
      <div class="cell-body">
        <div class="card">
          <span class="status-dot" aria-hidden="true"></span>
          <div class="card-top">
            <div style="display:flex;gap:4px;flex-shrink:0">
              <span class="badge">室</span>
              <span class="badge">知</span>
            </div>
            <p class="card-title">Lorem ipsum dolor sit amet</p>
          </div>
          <div class="meta-bar">
            <span class="meta-label">授</span>
            <span class="name-chip" title="陈思远">陈思远</span>
            <span class="name-chip" title="林晓雯">林晓雯</span>
            <span class="name-chip" title="王浩然">王浩然</span>
            <span class="meta-label">跨</span>
            <span class="name-chip" title="周子墨">周子墨</span>
          </div>
        </div>
      </div>
      <div class="row-footer">早饭</div>
    </div>
    <p class="hint">底部原头像位已改为「人名胶囊」；可在源码里改 <code>.name-chip</code> 文案或调 <code>max-width</code> 看长名省略效果。</p>
  </div>
</body>
</html>
