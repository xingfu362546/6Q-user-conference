<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>报读档案</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --page-bg: #ededed;
      --card-bg: #ffffff;
      --text-primary: #111111;
      --text-secondary: #888888;
      --tag-border: #d9d9d9;
      --accent: #ff7a45;
      --accent-soft: rgba(255, 122, 69, 0.14);
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.06);
      --radius-card: 12px;
      --radius-pill: 999px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --timeline-line: #e0e0e0;
      --status-active-bg: rgba(255, 122, 69, 0.12);
      --status-ended-bg: #f5f5f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: #c8c8c8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px 40px;
    }

    .phone {
      width: 100%;
      max-width: 390px;
      min-height: 720px;
      background: var(--page-bg);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .status-spacer {
      height: 12px;
      background: var(--page-bg);
    }

    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px 10px;
      background: var(--page-bg);
      position: relative;
      flex-shrink: 0;
    }

    .nav-back {
      width: 44px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      color: var(--text-primary);
      border: none;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      max-width: 58%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-cap {
      width: 88px;
      height: 32px;
      border-radius: 20px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.65);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 10px;
      gap: 6px;
    }

    .nav-cap-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #333;
      opacity: 0.75;
    }

    .nav-cap-line {
      width: 14px;
      height: 2px;
      background: #333;
      border-radius: 1px;
      opacity: 0.75;
    }

    .nav-cap-ring {
      width: 16px;
      height: 16px;
      border: 2px solid #333;
      border-radius: 50%;
      opacity: 0.75;
    }

    .subhead {
      padding: 0 16px 10px;
      font-size: 13px;
      color: var(--text-secondary);
      background: var(--page-bg);
    }

    .subhead strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .screen[hidden] {
      display: none !important;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 4px 14px calc(20px + var(--safe-bottom));
      -webkit-overflow-scrolling: touch;
    }

    /* 从上往下：时间轴主轴在左，内容在右 */
    .timeline {
      list-style: none;
      padding: 4px 0 8px;
    }

    .timeline-item {
      display: flex;
      gap: 0;
      position: relative;
    }

    .timeline-axis {
      width: 22px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 18px;
    }

    .timeline-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--timeline-line);
      z-index: 1;
      flex-shrink: 0;
    }

    .timeline-item.is-active .timeline-dot {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .timeline-line {
      flex: 1;
      width: 2px;
      min-height: 12px;
      background: var(--timeline-line);
      margin-top: 4px;
    }

    .timeline-item:last-child .timeline-line {
      visibility: hidden;
      min-height: 0;
      margin: 0;
    }

    .timeline-body {
      flex: 1;
      min-width: 0;
      padding: 0 0 16px 12px;
    }

    .plan-card {
      width: 100%;
      text-align: left;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 14px 14px 12px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .plan-card:active {
      transform: scale(0.99);
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.08);
    }

    .plan-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .plan-date {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .plan-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .plan-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      line-height: 1.4;
    }

    .status-pill.is-active {
      color: var(--accent);
      background: var(--status-active-bg);
      border: 1px solid rgba(255, 122, 69, 0.35);
    }

    .status-pill.is-ended {
      color: #666;
      background: var(--status-ended-bg);
      border: 1px solid var(--tag-border);
    }

    .plan-record-chip {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px 5px 9px;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      border: 1px solid rgba(255, 122, 69, 0.55);
      border-radius: var(--radius-pill);
      background: linear-gradient(180deg, #fff 0%, #fffaf8 100%);
      box-shadow: 0 1px 3px rgba(255, 122, 69, 0.12);
      flex-shrink: 0;
    }

    .plan-record-icon {
      flex-shrink: 0;
      opacity: 0.92;
    }

    .plan-record-chevron {
      flex-shrink: 0;
      opacity: 0.85;
    }

    .detail-intro {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.55;
      padding: 12px 14px 4px;
      background: var(--page-bg);
    }

    .detail-sections {
      padding: 8px 14px calc(24px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-block {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 14px;
    }

    .detail-block h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f0f0f0;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
      padding: 6px 0;
      gap: 12px;
    }

    .detail-row span:last-child {
      color: var(--text-primary);
      font-weight: 500;
      text-align: right;
    }

    .detail-text {
      font-size: 13px;
      color: #444;
      line-height: 1.65;
    }

    .empty-tip {
      text-align: center;
      padding: 48px 20px;
      font-size: 14px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="phone" aria-label="报读档案">
    <div class="status-spacer" aria-hidden="true"></div>
    <header class="nav-bar">
      <a href="my-family-page.html" class="nav-back" id="nav-back" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </a>
      <h1 class="nav-title" id="nav-title">报读档案</h1>
      <div class="nav-cap" aria-hidden="true">
        <span class="nav-cap-dot"></span>
        <span class="nav-cap-dot"></span>
        <span class="nav-cap-dot"></span>
        <span class="nav-cap-line"></span>
        <span class="nav-cap-ring"></span>
      </div>
    </header>

    <p class="subhead" id="subhead"></p>

    <div class="screen" id="screen-list">
      <div class="scroll-area">
        <ul class="timeline" id="timeline"></ul>
      </div>
    </div>

    <div class="screen" id="screen-detail" hidden>
      <div class="scroll-area">
        <p class="detail-intro" id="detail-intro"></p>
        <div class="detail-sections" id="detail-sections"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      /** 课程计划命名示例：{年份}年{营期/系列} {班级名} —— 按 sort 倒序（新在上） */
      var PLANS = [
        {
          id: "p1",
          sort: "2026-07-12",
          enrolledAt: "2026-07-12",
          title: "2026年夏令营 EQ大1班",
          status: "上课中",
          active: true,
          period: "2026-07-10 至 2026-08-20",
          attendance: "12 / 14 次",
          performance: "积极参与课堂互动，情绪识别练习完成度较高。",
          assessment: "阶段测评：良好（EQ 维度 4.2 / 5）",
          teacherNote: "建议家长在家延续「情绪温度计」小游戏，巩固表达习惯。",
          archive: "成长档案已归档（课堂照片 8 张、作品 3 份）"
        },
        {
          id: "p2",
          sort: "2026-03-02",
          enrolledAt: "2026-03-02",
          title: "2026年春季系统课 EQ启蒙3班",
          status: "上课中",
          active: true,
          period: "2026-03-01 至 2026-06-28",
          attendance: "9 / 12 次",
          performance: "规则意识进步明显，小组任务中能主动分工。",
          assessment: "期中反馈：达标",
          teacherNote: "可尝试让孩子记录每周一件「让自己骄傲的小事」。",
          archive: "电子学习单 6 份"
        },
        {
          id: "p3",
          sort: "2025-12-18",
          enrolledAt: "2025-12-18",
          title: "2025年冬令营 EQ进阶2班",
          status: "已结营",
          active: false,
          period: "2025-12-15 至 2025-12-25",
          attendance: "10 / 10 次",
          performance: "冲突场景演练中能够使用「我句式」表达需求。",
          assessment: "结营测评：优秀",
          teacherNote: "结营后情绪日记坚持得很好，继续保持。",
          archive: "结营证书、评语卡、活动相册已生成"
        },
        {
          id: "p4",
          sort: "2025-07-08",
          enrolledAt: "2025-07-08",
          title: "2025年夏令营 EQ大2班",
          status: "已结营",
          active: false,
          period: "2025-07-05 至 2025-07-28",
          attendance: "18 / 20 次",
          performance: "团队任务中协作稳定，偶有注意力分散，已个别跟进。",
          assessment: "结营测评：良好",
          teacherNote: "暑期节奏较快，秋季系统课可放慢巩固。",
          archive: "档案包已锁定（只读）"
        }
      ];

      PLANS.sort(function (a, b) {
        return b.sort.localeCompare(a.sort);
      });

      var params = new URLSearchParams(window.location.search);
      var relation = params.get("relation") === "女儿" ? "女儿" : "儿子";
      var childName = params.get("name") || "小鱼";
      document.getElementById("subhead").innerHTML =
        "<strong>" + relation + "</strong> " + childName + " · 按报读时间倒序";

      var timelineEl = document.getElementById("timeline");
      var screenList = document.getElementById("screen-list");
      var screenDetail = document.getElementById("screen-detail");
      var navTitle = document.getElementById("nav-title");
      var navBack = document.getElementById("nav-back");
      var subhead = document.getElementById("subhead");
      var detailIntro = document.getElementById("detail-intro");
      var detailSections = document.getElementById("detail-sections");

      function statusPill(plan) {
        var cls = plan.active ? "is-active" : "is-ended";
        var text = plan.status === "上课中" ? "【上课中】" : "【已结营】";
        return '<span class="status-pill ' + cls + '">' + text + "</span>";
      }

      function renderList() {
        timelineEl.innerHTML = PLANS.map(function (plan) {
          return (
            '<li class="timeline-item' + (plan.active ? " is-active" : "") + '">' +
            '<div class="timeline-axis">' +
            '<span class="timeline-dot" aria-hidden="true"></span>' +
            '<span class="timeline-line" aria-hidden="true"></span>' +
            "</div>" +
            '<div class="timeline-body">' +
            '<button type="button" class="plan-card" data-id="' +
            plan.id +
            '" aria-label="查看「' +
            plan.title +
            '」成长记录">' +
            '<div class="plan-date">报读于' +
            plan.enrolledAt +
            "</div>" +
            '<div class="plan-title">' +
            plan.title +
            "</div>" +
            '<div class="plan-meta">' +
            statusPill(plan) +
            '<span class="plan-record-chip">' +
            '<svg class="plan-record-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M12 20V10M18 20V4M6 20v-4"/>' +
            "</svg>" +
            "<span>成长记录</span>" +
            '<svg class="plan-record-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M9 18l6-6-6-6"/>' +
            "</svg>" +
            "</span>" +
            "</div>" +
            "</button>" +
            "</div>" +
            "</li>"
          );
        }).join("");

        timelineEl.querySelectorAll(".plan-card").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var id = btn.getAttribute("data-id");
            var plan = PLANS.find(function (p) {
              return p.id === id;
            });
            if (plan) openDetail(plan);
          });
        });
      }

      function openDetail(plan) {
        screenList.hidden = true;
        screenDetail.hidden = false;
        subhead.hidden = true;
        navTitle.textContent = "学习档案";
        navBack.href = "#";
        navBack.setAttribute("aria-label", "返回列表");

        detailIntro.innerHTML =
          "<strong>" +
          plan.title +
          "</strong><br/>状态：" +
          (plan.status === "上课中" ? "【上课中】" : "【已结营】") +
          " · " +
          plan.period;

        detailSections.innerHTML =
          '<section class="detail-block"><h3>出勤与参与</h3>' +
          '<div class="detail-row"><span>出勤</span><span>' +
          plan.attendance +
          "</span></div>" +
          '<p class="detail-text" style="margin-top:8px">' +
          plan.performance +
          "</p></section>" +
          '<section class="detail-block"><h3>测评与目标</h3>' +
          '<p class="detail-text">' +
          plan.assessment +
          "</p></section>" +
          '<section class="detail-block"><h3>老师寄语</h3>' +
          '<p class="detail-text">' +
          plan.teacherNote +
          "</p></section>" +
          '<section class="detail-block"><h3>档案材料</h3>' +
          '<p class="detail-text">' +
          plan.archive +
          "</p></section>";
      }

      function closeDetail(e) {
        if (e) e.preventDefault();
        screenDetail.hidden = true;
        screenList.hidden = false;
        subhead.hidden = false;
        navTitle.textContent = "报读档案";
        navBack.href = "my-family-page.html";
        navBack.setAttribute("aria-label", "返回");
      }

      navBack.addEventListener("click", function (e) {
        if (!screenDetail.hidden) {
          e.preventDefault();
          closeDetail();
        }
      });

      renderList();
    })();
  </script>
</body>
</html>
