<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>砍价之星排行</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <header class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <span class="bars"></span>
        <span class="wifi"></span>
        <span class="battery"></span>
      </div>
    </header>

    <div class="top-nav">
      <button class="back-btn" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M15 6l-6 6 6 6" stroke="#555" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <h1>砍价之星排行</h1>
      <span class="empty-holder"></span>
    </div>

    <section class="top-three">
      <a href="#" class="rules">ⓘ 规则与奖励</a>
      <div class="podium">
        <article class="podium-item rank2">
          <div class="avatar"></div>
          <div class="podium-card orange">
            <p class="rank">TOP2</p>
            <p class="count">发布商品数：9</p>
            <p class="money">832万</p>
          </div>
        </article>
        <article class="podium-item rank1">
          <div class="avatar"></div>
          <div class="podium-card red">
            <p class="rank">TOP1</p>
            <p class="count">发布商品数：12</p>
            <p class="money">8320万</p>
          </div>
        </article>
        <article class="podium-item rank3">
          <div class="avatar"></div>
          <div class="podium-card blue">
            <p class="rank">TOP3</p>
            <p class="count">发布商品数：9</p>
            <p class="money">389万</p>
          </div>
        </article>
      </div>
    </section>

    <main class="rank-list">
      <article class="rank-row">
        <span class="num">4</span>
        <div class="user">
          <span class="avatar sm"></span>
          <div class="meta">
            <p class="name">乌语花香</p>
            <p class="sub">发布次数：1249</p>
          </div>
        </div>
        <span class="value">222万</span>
      </article>

      <article class="rank-row">
        <span class="num">5</span>
        <div class="user">
          <span class="avatar sm"></span>
          <div class="meta">
            <p class="name">泽泽</p>
            <p class="sub">发布次数：1249</p>
          </div>
        </div>
        <span class="value">122万</span>
      </article>

      <article class="rank-row">
        <span class="num">6</span>
        <div class="user">
          <span class="avatar sm"></span>
          <div class="meta">
            <p class="name">小叶</p>
            <p class="sub">发布次数：1249</p>
          </div>
        </div>
        <span class="value">145万</span>
      </article>

      <article class="rank-row">
        <span class="num">7</span>
        <div class="user">
          <span class="avatar sm"></span>
          <div class="meta">
            <p class="name">小叶</p>
            <p class="sub">发布次数：1249</p>
          </div>
        </div>
        <span class="value">145万</span>
      </article>

      <article class="rank-row">
        <span class="num">8</span>
        <div class="user">
          <span class="avatar sm"></span>
          <div class="meta">
            <p class="name">小布</p>
            <p class="sub">发布次数：1249</p>
          </div>
        </div>
        <span class="value">145万</span>
      </article>

      <article class="rank-row">
        <span class="num">9</span>
        <div class="user">
          <span class="avatar sm"></span>
          <div class="meta">
            <p class="name">阿刀爱学习</p>
            <p class="sub">发布次数：1249</p>
          </div>
        </div>
        <span class="value">145万</span>
      </article>

      <article class="rank-row">
        <span class="num">10</span>
        <div class="user">
          <span class="avatar sm"></span>
          <div class="meta">
            <p class="name">阿刀爱学习</p>
            <p class="sub">发布次数：1249</p>
          </div>
        </div>
        <span class="value">145万</span>
      </article>
    </main>

    <footer class="mine-bar">
      <div class="left">
        <p class="mine-rank">106</p>
        <p class="mine-sub">当前排名</p>
      </div>
      <div class="mine-user">
        <span class="avatar sm me"></span>
        <p class="mine-name">小蜜蜂（自己）</p>
      </div>
      <div class="right">
        <p class="mine-value">330万</p>
        <p class="mine-sub">发布商品数：10</p>
      </div>
    </footer>

    <div class="home-indicator"></div>
  </div>
</body>
</html>
