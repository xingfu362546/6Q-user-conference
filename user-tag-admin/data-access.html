<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据接入 · 用户标签平台</title>
  <link rel="stylesheet" href="css/ut-tokens.css" />
  <link rel="stylesheet" href="css/ut-shell.css" />
  <link rel="stylesheet" href="css/ut-components.css" />
  <style>
    .ut-endpoint-card { max-width: 720px; margin: 0 auto; padding: var(--space-6); }
    .ut-hint { font-size: 12px; color: var(--text-muted); margin-top: var(--space-3); line-height: 1.6; }
  </style>
</head>
<body class="ut-body" data-ut-page="data-access">
  <div class="ut-app">
    <header class="ut-topbar" id="ut-topbar-mount"></header>
    <div class="ut-row">
      <div id="ut-side-mount"></div>
      <div class="ut-main">
        <div class="ut-workpad">
          <nav class="ut-breadcrumb">
            <a href="index.html">首页</a> / <strong>数据接入</strong>
          </nav>
          <div class="ut-page-head">
            <div class="ut-page-head__left">
              <h1>数据接入</h1>
              <p class="ut-page-head__desc">查看本项目 HTTPS 上报地址并复制给业务方；地址<strong>仅开发可改</strong>，运营不可编辑。</p>
            </div>
          </div>

          <div class="ut-card ut-endpoint-card">
            <label class="ut-field" style="min-width:0;width:100%">
              <span style="font-size:13px;font-weight:600">HTTPS 数据接收地址</span>
              <div class="ut-endpoint-row">
                <input
                  class="ut-input"
                  id="endpoint-url"
                  type="text"
                  readonly
                  aria-readonly="true"
                  value="https://10.23.112.23:8106/s?project=production"
                />
                <button type="button" class="ut-btn ut-btn--primary" data-copy data-copy-target="#endpoint-url">复制地址</button>
              </div>
            </label>
            <p class="ut-hint">
              <span class="ut-badge ut-badge--neutral">只读</span>
              如需变更上报地址，请联系开发人员在本环境后台修改；本页不提供 project、token 等参数配置。
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/ut-shell.js"></script>
  <script src="js/ut-admin.js"></script>
</body>
</html>
