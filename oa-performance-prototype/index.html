<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6Q · OA 绩效信息化原型</title>
  <meta http-equiv="refresh" content="0; url=prototype/index.html" />
  <link rel="canonical" href="prototype/index.html" />
  <style>
    :root {
      --bg: #f0f2f5;
      --primary: #1890ff;
      --ink: #262626;
      --muted: #8c8c8c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 8px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      color: var(--primary);
      background: #e6f7ff;
      padding: 2px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
    a {
      display: inline-block;
      padding: 10px 24px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }
    a:hover { background: #40a9ff; }
  </style>
  <script>location.replace('prototype/index.html');</script>
</head>
<body>
  <div class="card">
    <span class="badge">Cloudflare Pages · v1.1.0</span>
    <h1>OA 绩效信息化 · 交互原型</h1>
    <p>小程序 + OA 双端 HTML 原型。若未自动跳转，请点击下方按钮。</p>
    <a href="prototype/index.html">进入原型导航</a>
  </div>
</body>
</html>
