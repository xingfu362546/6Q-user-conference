<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>绩效待办 · 已提交</title>
  <link rel="stylesheet" href="../assets/6q-theme.css" />
  <link rel="stylesheet" href="../assets/common.css" />
  <link rel="stylesheet" href="../assets/oa-perf.css" />
  <link rel="stylesheet" href="../assets/proto-notes.css" />
</head>
<body>
  <div class="q-oa-app">
    <header id="q-oa-topbar"></header>
    <div class="q-oa-body">
      <aside id="q-oa-sidenav" class="q-oa-sidenav"></aside>
      <div class="q-oa-main">
        <nav class="q-oa-breadcrumb">个人中心 &gt; 我的绩效 &gt; <strong>已提交</strong></nav>
        <div id="q-oa-pagetabs" class="q-oa-pagetabs"></div>
        <div class="q-oa-page">
          <div class="q-card-panel">
            <nav class="perf-segment">
              <a href="personal-perf.html">当前待办</a>
              <a href="personal-perf-overdue.html">逾期</a>
              <a href="personal-perf-past.html" class="is-active">已提交</a>
            </nav>
            <div class="perf-tip perf-tip-green">🔒 已确认归档任务：仅可回看本人填写内容；不可见上级评分与核定结果。</div>
            <div class="q-table-wrap">
              <table class="q-table">
                <thead>
                  <tr><th>考核任务</th><th>类型</th><th>提交时间</th><th>状态</th><th>操作</th></tr>
                </thead>
                <tbody id="emp-past-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/frame.js"></script>
  <script src="../assets/perf-workflow.js"></script>
  <script src="../assets/employee-tasks.js"></script>
  <script>
    initOaShell({
      topModule: 'personal',
      sideActive: 'perf-list',
      pageTabs: [
        { key: 'home', label: '首页', href: 'index.html' },
        { key: 'perf', label: '绩效待办', href: 'personal-perf.html', closable: true },
        { key: 'past', label: '已提交', href: 'personal-perf-past.html', closable: true },
      ],
      activeTab: 'past',
    });
    EmployeeTasks.renderPastTable('emp-past-tbody');
    EmployeeTasks.updateSegmentBadges();
  </script>
  <script src="../assets/proto-notes-data.js"></script>
  <script src="../assets/proto-notes.js"></script>
</body>
</html>
