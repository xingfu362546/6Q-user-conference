<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>评价人维护 · 绩效管理</title>
  <link rel="stylesheet" href="../assets/6q-theme.css" />
  <link rel="stylesheet" href="../assets/common.css" />
  <link rel="stylesheet" href="../assets/oa-perf.css" />
  <link rel="stylesheet" href="../assets/proto-notes.css" />
</head>
<body>
  <div class="q-oa-app">
    <header id="q-oa-topbar"></header>
    <div class="q-oa-body">
      <aside id="q-oa-sidenav" class="q-oa-sidenav"></aside>
      <div class="q-oa-main">
        <nav class="q-oa-breadcrumb">人力资源 &gt; 绩效管理 &gt; <strong>评价人维护</strong></nav>
        <div class="q-oa-page">
          <div class="q-toolbar">
            <button class="q-btn" type="button" id="btn-download">下载当前名单</button>
            <label class="q-btn q-btn-primary">导入 CSV<input id="file-import" type="file" accept=".csv,text/csv" hidden /></label>
          </div>
          <p class="hr-hint">上级和分管都从组织架构里选人，选中后自动带出工号，不用手输。点人员格子打开选择框，左侧选部门，右侧点人。导入仍支持 CSV，表头：员工工号,上级工号,分管工号,员工姓名,上级姓名,分管姓名；后三列可空。</p>
          <p id="eval-summary" class="hr-hint"></p>
          <div id="import-errors" class="hr-hint" style="color:#cf1322"></div>
          <div class="q-table-wrap">
            <table class="q-table">
              <thead>
                <tr>
                  <th>员工工号</th>
                  <th>姓名</th>
                  <th>部门</th>
                  <th>岗位</th>
                  <th>上级（评价人）</th>
                  <th>分管领导</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="eval-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/frame.js"></script>
  <script src="../assets/perf-hr-store.js"></script>
  <script src="../assets/perf-org-picker.js"></script>
  <script>
    initOaShell({
      topModule: 'hr',
      sideActive: 'evaluators',
      pageTabs: [
        { key: 'home', label: '首页', href: 'index.html' },
        { key: 'evaluators', label: '评价人维护', href: 'hr-evaluators.html', closable: true }
      ],
      activeTab: 'evaluators'
    });

    // 未保存的选择先放这里，点「保存」才落库
    var draft = {};

    function pickCell(p, col) {
      var no = (draft[p.no] && draft[p.no][col]) || '';
      var person = no ? PerfHrStore.person(no) : null;
      var label = person
        ? '<b>' + person.name + '</b><span class="cell-sub">' + person.no + ' · ' + person.role + '</span>'
        : '<span class="cell-empty">' + (col === 'sup' ? '点击选择上级' : '点击选择分管') + '</span>';
      return '<button type="button" class="perf-person-cell' + (person ? '' : ' is-empty') + '" data-pick="' + p.no + '" data-col="' + col + '">' +
        label + '<span class="cell-caret">▾</span></button>' +
        (col === 'div' && person ? '<button type="button" class="perf-person-clear" data-clear="' + p.no + '" title="清空分管">×</button>' : '');
    }

    function paintTable() {
      document.getElementById('eval-body').innerHTML = PerfHrStore.PEOPLE.map(function (p) {
        return '<tr data-no="' + p.no + '"><td>' + p.no + '</td><td>' + p.name + '</td><td>' + p.org + '</td><td>' + p.role + '</td>' +
          '<td class="cell-pick">' + pickCell(p, 'sup') + '</td>' +
          '<td class="cell-pick">' + pickCell(p, 'div') + '</td>' +
          '<td><button type="button" class="q-btn' + (isDirty(p.no) ? ' q-btn-primary' : '') + '" data-save="' + p.no + '">' + (isDirty(p.no) ? '保存' : '已保存') + '</button></td></tr>';
      }).join('');
    }

    function isDirty(no) {
      var map = PerfHrStore.evalMap();
      var divMap = PerfHrStore.divisionMap();
      return (draft[no].sup || '') !== (map[no] || '') || (draft[no].div || '') !== (divMap[no] || '');
    }

    function render() {
      var map = PerfHrStore.evalMap();
      var divMap = PerfHrStore.divisionMap();
      draft = {};
      PerfHrStore.PEOPLE.forEach(function (p) {
        draft[p.no] = { sup: map[p.no] || '', div: divMap[p.no] || '' };
      });
      dashboard();
      paintTable();
    }

    function dashboard() {
      var map = PerfHrStore.evalMap();
      var divMap = PerfHrStore.divisionMap();
      var total = PerfHrStore.PEOPLE.length;
      var noSup = PerfHrStore.PEOPLE.filter(function (p) { return !map[p.no]; }).length;
      var noDiv = PerfHrStore.PEOPLE.filter(function (p) { return !divMap[p.no]; }).length;
      var box = document.getElementById('eval-summary');
      if (box) box.innerHTML = '共 <b>' + total + '</b> 人 · 未指定上级 <b class="' + (noSup ? 'warn' : '') + '">' + noSup + '</b> 人 · 未指定分管 <b class="' + (noDiv ? 'warn' : '') + '">' + noDiv + '</b> 人';
    }

    document.getElementById('eval-body').addEventListener('click', function (e) {
      var pick = e.target.closest('[data-pick]');
      if (pick) {
        var empNo = pick.dataset.pick;
        var col = pick.dataset.col;
        var emp = PerfHrStore.person(empNo);
        PerfOrgPicker.open({
          title: (col === 'sup' ? '选择上级 · ' : '选择分管 · ') + emp.name,
          subtitle: col === 'sup' ? '上级负责该员工这一步的评分；提交后即视为已确认。' : '分管只在季度评审中评分；可以留空。',
          selectedNo: draft[empNo][col],
          excludeNo: empNo,
          allowClear: col === 'div',
          onPick: function (person) {
            draft[empNo][col] = person ? person.no : '';
            paintTable();
            var box = document.getElementById('import-errors');
            box.style.color = '#1f2933';
            box.textContent = person ? '已选择 ' + person.name + '，点这一行的「保存」生效' : '已清空分管，点这一行的「保存」生效';
          }
        });
        return;
      }
      var clear = e.target.closest('[data-clear]');
      if (clear) {
        var no = clear.dataset.clear;
        draft[no].div = '';
        paintTable();
        return;
      }
      var btn = e.target.closest('[data-save]');
      if (!btn) return;
      var empNo2 = btn.dataset.save;
      var box = document.getElementById('import-errors');
      var sup = draft[empNo2].sup;
      var div = draft[empNo2].div;
      if (!sup) { box.style.color = '#cf1322'; box.textContent = '请先选上级'; return; }
      if (!PerfHrStore.person(sup)) { box.style.color = '#cf1322'; box.textContent = '上级工号不存在'; return; }
      if (sup === empNo2) { box.style.color = '#cf1322'; box.textContent = '上级不能是员工本人'; return; }
      if (div && !PerfHrStore.person(div)) { box.style.color = '#cf1322'; box.textContent = '分管工号不存在'; return; }
      if (div === empNo2) { box.style.color = '#cf1322'; box.textContent = '分管不能是员工本人'; return; }
      PerfHrStore.setEvaluator(empNo2, sup);
      PerfHrStore.setDivision(empNo2, div);
      box.style.color = '#389e0d';
      box.textContent = '已保存 ' + PerfHrStore.person(empNo2).name;
      render();
    });

    document.getElementById('btn-download').addEventListener('click', function () {
      var map = PerfHrStore.evalMap();
      var divMap = PerfHrStore.divisionMap();
      var lines = ['员工工号,上级工号,分管工号,员工姓名,上级姓名,分管姓名'];
      PerfHrStore.PEOPLE.forEach(function (p) {
        var ev = map[p.no] || '';
        var dv = divMap[p.no] || '';
        var evPerson = PerfHrStore.person(ev);
        var dvPerson = PerfHrStore.person(dv);
        lines.push([p.no, ev, dv, p.name, evPerson ? evPerson.name : '', dvPerson ? dvPerson.name : ''].join(','));
      });
      var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '评价人名单.csv';
      a.click();
    });

    document.getElementById('file-import').addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var res = PerfHrStore.importEvaluators(String(reader.result || ''));
        var box = document.getElementById('import-errors');
        if (!res.ok) {
          box.textContent = res.error + (res.errors || []).map(function (item) {
            return '；第 ' + item.row + ' 行 ' + item.no + ' ' + item.message;
          }).join('');
          return;
        }
        box.textContent = '已更新 ' + res.count + ' 人';
        box.style.color = '#389e0d';
        render();
      };
      reader.readAsText(file, 'utf-8');
    });

    render();
  </script>
  <script src="../assets/proto-notes-data.js"></script>
  <script src="../assets/proto-notes.js"></script>
</body>
</html>
