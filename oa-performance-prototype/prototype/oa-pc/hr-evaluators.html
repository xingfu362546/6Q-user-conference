<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>评价人维护 · 绩效管理</title>
  <link rel="stylesheet" href="../assets/6q-theme.css" />
  <link rel="stylesheet" href="../assets/common.css" />
  <link rel="stylesheet" href="../assets/oa-perf.css" />
  <link rel="stylesheet" href="../assets/proto-notes.css" />
</head>
<body>
  <div class="q-oa-app">
    <header id="q-oa-topbar"></header>
    <div class="q-oa-body">
      <aside id="q-oa-sidenav" class="q-oa-sidenav"></aside>
      <div class="q-oa-main">
        <nav class="q-oa-breadcrumb">人力资源 &gt; 绩效管理 &gt; <strong>评价人维护</strong></nav>
        <div class="q-oa-page">
          <div class="q-toolbar">
            <button class="q-btn" type="button" id="btn-download">下载当前名单</button>
            <label class="q-btn q-btn-primary">导入 CSV<input id="file-import" type="file" accept=".csv,text/csv" hidden /></label>
          </div>
          <p class="hr-hint">评价人按工号识别。表头：员工工号,评价人工号,员工姓名,评价人姓名。任一工号不存在则整批不写入。</p>
          <div id="import-errors" class="hr-hint" style="color:#cf1322"></div>
          <div class="q-table-wrap">
            <table class="q-table">
              <thead>
                <tr>
                  <th>员工工号</th>
                  <th>姓名</th>
                  <th>部门</th>
                  <th>岗位</th>
                  <th>评价人工号</th>
                  <th>评价人姓名</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="eval-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/frame.js"></script>
  <script src="../assets/perf-hr-store.js"></script>
  <script>
    initOaShell({
      topModule: 'hr',
      sideActive: 'evaluators',
      pageTabs: [
        { key: 'home', label: '首页', href: 'index.html' },
        { key: 'evaluators', label: '评价人维护', href: 'hr-evaluators.html', closable: true }
      ],
      activeTab: 'evaluators'
    });

    function render() {
      var map = PerfHrStore.evalMap();
      document.getElementById('eval-body').innerHTML = PerfHrStore.PEOPLE.map(function (p) {
        var ev = map[p.no] || '';
        var evName = ev && PerfHrStore.person(ev) ? PerfHrStore.person(ev).name : '';
        return '<tr><td>' + p.no + '</td><td>' + p.name + '</td><td>' + p.org + '</td><td>' + p.role + '</td>' +
          '<td><input data-emp="' + p.no + '" value="' + ev + '" style="width:110px" /></td>' +
          '<td class="ev-name">' + (evName || '未指定') + '</td>' +
          '<td><button type="button" class="q-btn" data-save="' + p.no + '">保存</button></td></tr>';
      }).join('');
    }

    document.getElementById('eval-body').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-save]');
      if (!btn) return;
      var no = btn.dataset.save;
      var input = document.querySelector('input[data-emp="' + no + '"]');
      var res = PerfHrStore.setEvaluator(no, input.value.trim());
      var box = document.getElementById('import-errors');
      if (!res.ok) {
        box.textContent = (res.errors && res.errors[0] ? '第 ' + res.errors[0].row + ' 行 ' + res.errors[0].no + '：' : '') + res.error;
        return;
      }
      box.textContent = '';
      render();
    });

    document.getElementById('btn-download').addEventListener('click', function () {
      var map = PerfHrStore.evalMap();
      var lines = ['员工工号,评价人工号,员工姓名,评价人姓名'];
      PerfHrStore.PEOPLE.forEach(function (p) {
        var ev = map[p.no] || '';
        var evPerson = PerfHrStore.person(ev);
        lines.push([p.no, ev, p.name, evPerson ? evPerson.name : ''].join(','));
      });
      var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '评价人名单.csv';
      a.click();
    });

    document.getElementById('file-import').addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var res = PerfHrStore.importEvaluators(String(reader.result || ''));
        var box = document.getElementById('import-errors');
        if (!res.ok) {
          box.textContent = res.error + (res.errors || []).map(function (item) {
            return '；第 ' + item.row + ' 行 ' + item.no + ' ' + item.message;
          }).join('');
          return;
        }
        box.textContent = '已更新 ' + res.count + ' 人';
        box.style.color = '#389e0d';
        render();
      };
      reader.readAsText(file, 'utf-8');
    });

    render();
  </script>
  <script src="../assets/proto-notes-data.js"></script>
  <script src="../assets/proto-notes.js"></script>
</body>
</html>
