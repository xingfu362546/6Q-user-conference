<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>月度评分 · 上级</title>
  <link rel="stylesheet" href="../assets/6q-theme.css" />
  <link rel="stylesheet" href="../assets/common.css" />
  <link rel="stylesheet" href="../assets/oa-perf.css" />
  <link rel="stylesheet" href="../assets/supervisor-score.css" />
  <link rel="stylesheet" href="../assets/proto-notes.css" />
</head>
<body>
  <div class="q-oa-app">
    <header id="q-oa-topbar"></header>
    <div class="q-oa-body">
      <aside id="q-oa-sidenav" class="q-oa-sidenav"></aside>
      <div class="q-oa-main">
        <nav class="q-oa-breadcrumb">个人中心 &gt; <a href="supervisor-review-list.html">待我审核</a> &gt; <strong>月度评分</strong></nav>
        <div id="q-oa-pagetabs" class="q-oa-pagetabs"></div>
        <div class="q-oa-page">
          <div class="q-card-panel">
            <div class="score-header" id="score-header-info"></div>

            <div class="perf-tip perf-tip-blue" style="margin-bottom:12px">核心≤85 · 常规≤15 · 行为≤15 · 合计≤100。区块或单项超限将<strong style="color:#ff4d4f">红字提示</strong>且不可提交。</div>

            <div class="score-section-title">本月考评 · 打分区</div>
            <div class="score-kr-list" id="score-kr-list"></div>

            <div class="score-summary" id="score-summary"></div>

            <div class="score-section-title">加减分 · 核定</div>
            <table class="score-adjust-table">
              <thead><tr><th>加分事项</th><th>员工申报</th><th>核定分</th></tr></thead>
              <tbody id="adjust-plus-body"></tbody>
            </table>
            <table class="score-adjust-table">
              <thead><tr><th>减分事项</th><th>员工申报</th><th>核定分</th></tr></thead>
              <tbody id="adjust-minus-body"></tbody>
            </table>

            <div class="score-section-title">员工原文 · 对照</div>
            <div class="score-ref-tabs" id="score-ref-tabs"></div>
            <div id="score-ref-panels"></div>

            <div class="score-section-title">领导评语（选填）</div>
            <div class="score-comment">
              <textarea id="score-comment" placeholder="填写本期综合评价…"></textarea>
            </div>

            <div class="score-section-title">下月目标 · 只读查看（不打分、无需确认）</div>
            <div class="score-next-goals score-next-goals--readonly" id="next-month-goals"></div>

            <div class="score-actions">
              <button class="q-btn" type="button" id="btn-return-all">退回整表至员工</button>
              <a class="q-btn" href="supervisor-review-list.html" id="btn-back">返回列表</a>
              <button class="q-btn q-btn-primary" type="button" id="btn-submit" disabled>提交评分</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="score-leave-modal" id="leave-modal">
    <div class="score-leave-dialog">
      <h3>有未保存的评分</h3>
      <p>是否保存草稿后再离开？</p>
      <div class="btns">
        <button class="q-btn" type="button" id="leave-cancel">继续编辑</button>
        <button class="q-btn" type="button" id="leave-discard">放弃</button>
        <button class="q-btn q-btn-primary" type="button" id="leave-save">保存草稿</button>
      </div>
    </div>
  </div>

  <script src="../assets/frame.js"></script>
  <script src="../assets/supervisor-score.js"></script>
  <script>
    initOaShell({
      topModule: 'personal',
      sideActive: 'perf-list',
      pageTabs: [
        { key: 'review', label: '待我审核', href: 'supervisor-review-list.html', closable: true },
        { key: 'score', label: '月度评分', href: 'supervisor-score-monthly.html', closable: true },
      ],
      activeTab: 'score',
    });
    SupervisorScore.initOaMonthlyScorePage();
  </script>
  <script src="../assets/proto-notes-data.js"></script>
  <script src="../assets/proto-notes.js"></script>
</body>
</html>
