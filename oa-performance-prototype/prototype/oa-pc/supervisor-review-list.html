<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>领导 · 待我审核</title>
  <link rel="stylesheet" href="../assets/6q-theme.css" />
  <link rel="stylesheet" href="../assets/common.css" />
  <link rel="stylesheet" href="../assets/oa-perf.css" />
  <link rel="stylesheet" href="../assets/proto-notes.css" />
</head>
<body>
  <div class="q-oa-app">
    <header id="q-oa-topbar"></header>
    <div class="q-oa-body">
      <aside id="q-oa-sidenav" class="q-oa-sidenav"></aside>
      <div class="q-oa-main">
        <nav class="q-oa-breadcrumb">个人中心 &gt; 我的绩效 &gt; <strong>领导 · 待我审核</strong></nav>
        <div id="q-oa-pagetabs" class="q-oa-pagetabs"></div>
        <div class="q-oa-page">
          <div class="tabs card" style="border-radius:2px 2px 0 0;border-bottom:none;margin-bottom:0">
            <button class="tab" data-tab="emp" onclick="location.href='personal-perf.html'">【员工】我的待办</button>
            <button class="tab active" data-tab="lead">【领导】待我审核 <span class="q-tag q-tag-orange">3</span></button>
          </div>
          <div class="q-card-panel" style="border-top:none;margin-top:0">
            <div class="perf-tip perf-tip-orange">📋 下属已提交的考核任务在此评分。列表 → 评分页 → 提交后返回列表。</div>
            <div class="q-table-wrap">
              <table class="q-table">
                <thead>
                  <tr><th>下属</th><th>考核期</th><th>提交时间</th><th>状态</th><th>操作</th></tr>
                </thead>
                <tbody id="review-list-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/frame.js"></script>
  <script src="../assets/supervisor-score.js"></script>
  <script>
    initOaShell({
      topModule: 'personal',
      sideActive: 'perf-list',
      pageTabs: [
        { key: 'home', label: '首页', href: 'index.html' },
        { key: 'review', label: '待我审核', href: 'supervisor-review-list.html', closable: true },
      ],
      activeTab: 'review',
    });
    SupervisorScore.renderReviewList('review-list-body');
  </script>
  <script src="../assets/proto-notes-data.js"></script>
  <script src="../assets/proto-notes.js"></script>
</body>
</html>
