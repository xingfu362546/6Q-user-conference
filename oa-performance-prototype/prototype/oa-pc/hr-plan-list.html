<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>计划管理 · 绩效管理</title>
  <link rel="stylesheet" href="../assets/6q-theme.css" />
  <link rel="stylesheet" href="../assets/common.css" />
  <link rel="stylesheet" href="../assets/oa-perf.css" />
  <link rel="stylesheet" href="../assets/proto-notes.css" />
</head>
<body>
  <div class="q-oa-app">
    <header id="q-oa-topbar"></header>
    <div class="q-oa-body">
      <aside id="q-oa-sidenav" class="q-oa-sidenav"></aside>
      <div class="q-oa-main">
        <nav class="q-oa-breadcrumb">人力资源 &gt; 绩效管理 &gt; <strong>计划管理</strong></nav>
        <div id="q-oa-pagetabs" class="q-oa-pagetabs"></div>
        <div class="q-oa-page">
          <div class="q-toolbar">
            <input class="q-search" placeholder="请输入计划名称" />
            <a class="q-btn q-btn-primary" href="hr-plan-create.html">+ 新建计划</a>
            <button class="q-btn" type="button">导出</button>
          </div>
          <div class="q-table-wrap">
            <table class="q-table">
              <thead>
                <tr>
                  <th>计划名称</th>
                  <th>考核类型</th>
                  <th>周期</th>
                  <th>参与范围</th>
                  <th>状态</th>
                  <th>进度</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>2026年5月月度考核</td>
                  <td>月度</td>
                  <td>2026-05</td>
                  <td>2 个范围包 · 12 人</td>
                  <td><span class="q-tag q-tag-blue">进行中</span></td>
                  <td>7/12</td>
                  <td>
                    <a href="hr-plan-detail.html?plan=2026-05">明细</a> ·
                    <a href="#" onclick="alert('催办（原型）');return false">催办</a>
                  </td>
                </tr>
                <tr>
                  <td>2026 Q2 季度考核</td>
                  <td>季度</td>
                  <td>2026-Q2</td>
                  <td>2 个范围包 · 12 人</td>
                  <td><span class="q-tag q-tag-blue">进行中</span></td>
                  <td>2/12</td>
                  <td>
                    <a href="hr-plan-detail.html?plan=2026-Q2">明细</a> ·
                    <a href="hr-plan-detail.html?plan=2026-Q2#import-sixq3j"><strong>导入 6Q3J</strong></a> ·
                    <a href="#" onclick="alert('催办（原型）');return false">催办</a>
                  </td>
                </tr>
                <tr>
                  <td>2026年4月月度考核</td>
                  <td>月度</td>
                  <td>2026-04</td>
                  <td>3 个范围包 · 198 人</td>
                  <td><span class="q-tag q-tag-green">已截止</span></td>
                  <td>198/200</td>
                  <td>
                    <a href="hr-plan-detail.html?plan=2026-04">明细</a> ·
                    <a href="#">统计</a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <p style="font-size:12px;color:var(--q-text-muted);margin-top:12px">
            旧菜单「员工月度/季度绩效」已下线；MVP 统一从计划管理进入。
          </p>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/frame.js"></script>
  <script src="../assets/perf-hr-store.js"></script>
  <script>
    initOaShell({
      topModule: 'hr',
      sideActive: 'plan',
      pageTabs: [
        { key: 'home', label: '首页', href: 'index.html' },
        { key: 'plan', label: '计划管理', href: 'hr-plan-list.html', closable: true },
      ],
      activeTab: 'plan',
    });
    function openEditPlan(id, plan, tr) {
      var old = document.getElementById('plan-edit-mask');
      if (old) old.remove();
      var mask = document.createElement('div');
      mask.id = 'plan-edit-mask';
      mask.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center';
      mask.innerHTML =
        '<div style="background:#fff;border-radius:8px;width:460px;max-width:94vw;padding:20px 22px">' +
        '<h3 style="margin:0 0 12px">编辑计划</h3>' +
        '<div class="hr-modal-field"><label>计划名称</label><input id="pe-name" type="text" style="width:100%" /></div>' +
        '<div class="hr-modal-field"><label>启动时间</label><input id="pe-start" type="text" placeholder="YYYY-MM-DDTHH:mm" style="width:100%" /></div>' +
        '<div class="hr-modal-field"><label>员工填写截止</label><input id="pe-fill" type="text" placeholder="YYYY-MM-DDTHH:mm" style="width:100%" /></div>' +
        '<div class="hr-modal-field"><label>上级评分截止</label><input id="pe-score" type="text" placeholder="YYYY-MM-DDTHH:mm" style="width:100%" /></div>' +
        '<div class="hr-modal-field"><label>确认截止</label><input id="pe-confirm" type="text" placeholder="YYYY-MM-DDTHH:mm" style="width:100%" /></div>' +
        '<p id="pe-error" style="color:#cf1322;font-size:12px;min-height:18px;margin:4px 0 8px"></p>' +
        '<div style="display:flex;justify-content:flex-end;gap:8px">' +
        '<button type="button" class="q-btn" id="pe-cancel">取消</button>' +
        '<button type="button" class="q-btn q-btn-primary" id="pe-save">保存</button></div></div>';
      document.body.appendChild(mask);
      mask.querySelector('#pe-name').value = plan.name || '';
      mask.querySelector('#pe-start').value = plan.start || '';
      mask.querySelector('#pe-fill').value = plan.fillEnd || '';
      mask.querySelector('#pe-score').value = plan.scoreEnd || '';
      mask.querySelector('#pe-confirm').value = plan.confirmEnd || '';
      function shut() { mask.remove(); }
      mask.querySelector('#pe-cancel').addEventListener('click', shut);
      mask.addEventListener('click', function (e) { if (e.target === mask) shut(); });
      mask.querySelector('#pe-save').addEventListener('click', function () {
        var res = PerfHrStore.editPlan(id, {
          name: mask.querySelector('#pe-name').value,
          start: mask.querySelector('#pe-start').value,
          fillEnd: mask.querySelector('#pe-fill').value,
          scoreEnd: mask.querySelector('#pe-score').value,
          confirmEnd: mask.querySelector('#pe-confirm').value
        });
        if (!res.ok) { mask.querySelector('#pe-error').textContent = res.error; return; }
        tr.cells[0].textContent = res.plan.name;
        tr.cells[2].textContent = res.plan.period || id;
        shut();
      });
    }

    var planIds = ['2026-05', '2026-Q2', '2026-04'];
    document.querySelectorAll('.q-table tbody tr').forEach(function (tr, index) {
      var id = planIds[index];
      var plan = id && window.PerfHrStore ? PerfHrStore.planOf(id) : null;
      if (plan) tr.cells[0].textContent = plan.name;
      var op = tr.cells[tr.cells.length - 1];
      var link = document.createElement('a');
      link.href = '#';
      link.textContent = '编辑';
      link.addEventListener('click', function (ev) {
        ev.preventDefault();
        var current = PerfHrStore.planOf(id);
        openEditPlan(id, current, tr);
      });
      op.appendChild(document.createTextNode(' · '));
      op.appendChild(link);
    });
  </script>
  <script src="../assets/proto-notes-data.js"></script>
  <script src="../assets/proto-notes.js"></script>
</body>
</html>
