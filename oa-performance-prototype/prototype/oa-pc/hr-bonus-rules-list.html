<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奖金规则 · 绩效管理</title>
  <link rel="stylesheet" href="../assets/6q-theme.css" />
  <link rel="stylesheet" href="../assets/common.css" />
  <link rel="stylesheet" href="../assets/proto-notes.css" />
</head>
<body>
  <div class="q-oa-app">
    <header id="q-oa-topbar"></header>
    <div class="q-oa-body">
      <aside id="q-oa-sidenav" class="q-oa-sidenav"></aside>
      <div class="q-oa-main">
        <nav class="q-oa-breadcrumb">人力资源 &gt; 绩效管理 &gt; <strong>奖金规则</strong></nav>
        <div id="q-oa-pagetabs" class="q-oa-pagetabs"></div>
        <div class="q-oa-page">
          <div class="q-toolbar">
            <input class="q-search" placeholder="搜索规则名称" />
            <a class="q-btn q-btn-primary" href="hr-bonus-rule-edit.html?id=new">+ 新建规则</a>
          </div>
          <p class="hr-hint" style="margin-top:0">
            在同一 <b>范围包 · 同职级</b> 内按绩效总得分排名；前几名加奖、末位扣减。创建考核计划时可绑定规则。
          </p>
          <div class="q-table-wrap">
            <table class="q-table">
              <thead>
                <tr>
                  <th>规则名称</th>
                  <th>适用类型</th>
                  <th>排名单元</th>
                  <th>奖扣摘要</th>
                  <th>最低人数</th>
                  <th>状态</th>
                  <th>引用计划</th>
                  <th>更新日期</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="bonus-rules-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/frame.js"></script>
  <script src="../assets/hr-bonus.js"></script>
  <script>
    initOaShell({
      topModule: 'hr',
      sideActive: 'bonus',
      pageTabs: [
        { key: 'home', label: '首页', href: 'index.html' },
        { key: 'bonus', label: '奖金规则', href: 'hr-bonus-rules-list.html', closable: true },
      ],
      activeTab: 'bonus',
    });
    initHrBonusRulesList();
  </script>
  <script src="../assets/proto-notes-data.js"></script>
  <script src="../assets/proto-notes.js"></script>
</body>
</html>
