<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>查看自填内容</title>
  <link rel="stylesheet" href="../assets/6q-theme.css" />
  <link rel="stylesheet" href="../assets/common.css" />
  <link rel="stylesheet" href="../assets/oa-perf.css" />
  <style>
    .readonly-banner {
      padding: 12px 16px; margin-bottom: 16px;
      background: #fffbe6; border: 1px solid #ffe58f; border-radius: 2px;
      font-size: 13px; color: #ad6800;
    }
    .readonly-block { margin-bottom: 16px; }
    .readonly-block h3 {
      margin: 0 0 12px; padding-bottom: 8px;
      font-size: 14px; font-weight: 600;
      border-bottom: 1px solid #f0f0f0;
    }
    .readonly-field { margin-bottom: 12px; }
    .readonly-field label { display: block; font-size: 12px; color: #999; margin-bottom: 4px; }
    .readonly-field p { margin: 0; font-size: 14px; color: #333; line-height: 1.6; }
    .emp-past-kr .score-section-title { margin-top: 0; }
  </style>
  <link rel="stylesheet" href="../assets/proto-notes.css" />
</head>
<body>
  <div class="q-oa-app">
    <header id="q-oa-topbar"></header>
    <div class="q-oa-body">
      <aside id="q-oa-sidenav" class="q-oa-sidenav"></aside>
      <div class="q-oa-main">
        <nav class="q-oa-breadcrumb">个人中心 &gt; 我的绩效 &gt; <a href="personal-perf-past.html">已提交</a> &gt; <strong id="emp-past-crumb-period">—</strong></nav>
        <div id="q-oa-pagetabs" class="q-oa-pagetabs"></div>
        <div class="q-oa-page">
          <div class="q-card-panel">
            <h2 id="emp-past-title" style="margin:0 0 12px;font-size:18px">—</h2>
            <div class="readonly-banner">🔒 只读模式：仅展示您提交的自填内容（KR / 行为 / 加减分 / 下月·下季目标 / 自评总结）。上级评分与综合核定结果不可见。</div>
            <div id="emp-past-root">加载中…</div>
            <div style="margin-top:20px">
              <a class="q-btn" id="emp-past-back" href="personal-perf-past.html">← 返回</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/frame.js"></script>
  <script src="../assets/perf-kr-hierarchy.js"></script>
  <script src="../assets/employee-past-copy.js"></script>
  <script src="../assets/supervisor-score.js"></script>
  <script src="../assets/employee-submit-view.js"></script>
  <script src="../assets/employee-tasks.js"></script>
  <script>
    initOaShell({
      topModule: 'personal',
      sideActive: 'perf-list',
      pageTabs: [
        { key: 'home', label: '首页', href: 'index.html' },
        { key: 'past', label: '已提交', href: 'personal-perf-past.html', closable: true },
        { key: 'view', label: '查看自填', href: location.pathname.split('/').pop() + location.search, closable: true },
      ],
      activeTab: 'view',
    });
    EmployeeSubmitView.initOaPastViewPage();
  </script>
  <script src="../assets/proto-notes-data.js"></script>
  <script src="../assets/proto-notes.js"></script>
</body>
</html>
