<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>月度填表 · 个人中心</title>
  <link rel="stylesheet" href="../assets/6q-theme.css" />
  <link rel="stylesheet" href="../assets/common.css" />
  <link rel="stylesheet" href="../assets/proto-notes.css" />
</head>
<body>
  <div class="q-oa-app">
    <header id="q-oa-topbar"></header>
    <div class="q-oa-body">
      <aside id="q-oa-sidenav" class="q-oa-sidenav"></aside>
      <div class="q-oa-main">
        <nav class="q-oa-breadcrumb">个人中心 &gt; 我的绩效 &gt; <strong>2026年5月 · 月度填表</strong></nav>
        <div id="q-oa-pagetabs" class="q-oa-pagetabs"></div>
        <div class="q-oa-page">
          <div class="oa-wizard-grid">
            <div class="q-card-panel" style="padding:0;overflow:hidden">
              <div class="stepper-wrap" id="stepper"></div>
              <div style="padding:16px">
                <div class="header-readonly" id="form-header"></div>
                <div id="wizard-content"></div>
                <div style="display:flex;gap:12px;margin-top:16px">
                  <button type="button" class="q-btn" id="btn-prev">上一步</button>
                  <button type="button" class="q-btn" id="btn-save">保存</button>
                  <button type="button" class="q-btn" id="btn-preview">预览全部</button>
                  <button type="button" class="q-btn q-btn-primary" id="btn-next">下一步</button>
                </div>
                <p id="save-time" class="hr-hint" style="margin-top:8px">尚未保存</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/frame.js"></script>
  <script src="../assets/employee-past-copy.js"></script>
  <script src="../assets/perf-score-format.js"></script>
  <script src="../assets/perf-kr-hierarchy.js"></script>
  <script src="../assets/perf-review-sheet.js"></script>
  <script src="../assets/perf-autosave.js"></script>
  <script src="../assets/perf-quarter-fill.js"></script>
  <script src="../assets/wizard.js"></script>
  <script>
    initOaShell({
      topModule: 'personal',
      sideActive: 'perf-list',
      pageTabs: [
        { key: 'home', label: '首页', href: 'index.html' },
        { key: 'perf', label: '绩效待办', href: 'personal-perf.html', closable: true },
        { key: 'monthly', label: '月度填表', href: 'monthly-wizard.html', closable: true },
      ],
      activeTab: 'monthly',
    });
    initMonthlyWizard({
      storageKey: 'perf-monthly-oa-pc',
      currentPeriodId: 'm202604',
      onSubmit: function() { location.href = 'personal-perf.html'; },
    });
  </script>
  <script src="../assets/proto-notes-data.js"></script>
  <script src="../assets/proto-notes.js"></script>
</body>
</html>
