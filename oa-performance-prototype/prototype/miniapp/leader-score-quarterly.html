<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>季度评分</title>
  <link rel="stylesheet" href="../assets/6q-theme.css" />
  <link rel="stylesheet" href="../assets/common.css" />
  <link rel="stylesheet" href="../assets/mp-perf.css" />
  <link rel="stylesheet" href="../assets/oa-perf.css" />
  <link rel="stylesheet" href="../assets/supervisor-score.css" />
  <link rel="stylesheet" href="../assets/proto-notes.css" />
</head>
<body style="background:#e8e8e8">
  <div class="mp-device">
    <div class="mp-screen">
      <div class="mp-capsule" aria-hidden="true"></div>
      <div class="mp-subnav">
        <button class="back" type="button" onclick="location.href='task-list.html'">‹</button>
        <div class="title">季度评分</div>
      </div>
      <div class="mp-body mp-body--score" style="padding-bottom:88px;background:#f5f5f5">
        <div class="score-header" id="score-header-info"></div>
        <div id="score-role-banner" class="perf-tip perf-tip-blue score-role-banner" style="margin:12px"></div>
        <div id="score-sixq3j" style="margin:0 12px 12px"></div>
        <div class="perf-tip" style="margin:0 12px 12px;font-size:12px">与 OA 同源 · 上级/分管分列 · 自评×20%+上级×40%+分管×40%</div>
        <div class="score-section-title" style="padding:0 12px">本季考评 · 打分区</div>
        <div class="score-kr-list" id="score-kr-list" style="padding:0 12px"></div>
        <div class="score-summary score-summary--quarter" id="score-summary" style="margin:12px"></div>
        <div class="score-section-title" style="padding:0 12px">加减分 · 上级/分管核定</div>
        <div style="padding:0 12px;overflow-x:auto">
          <table class="score-adjust-table score-adjust-table--quarter">
            <thead><tr><th>事项</th><th>员工</th><th>上级</th><th>分管</th></tr></thead>
            <tbody id="adjust-plus-body"></tbody>
          </table>
          <table class="score-adjust-table score-adjust-table--quarter">
            <thead><tr><th>事项</th><th>员工</th><th>上级</th><th>分管</th></tr></thead>
            <tbody id="adjust-minus-body"></tbody>
          </table>
        </div>
        <div id="division-final-override" style="padding:0 12px"></div>
        <div id="score-interview-readonly" style="padding:0 12px"></div>
      </div>
      <div class="mp-score-footer" style="display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #eee">
        <a class="q-btn" style="flex:1;text-align:center;padding:12px" href="task-list.html" id="btn-back">返回</a>
        <button type="button" class="q-btn q-btn-primary" id="btn-submit" style="flex:1;padding:12px">提交评分</button>
      </div>
    </div>
  </div>
  <script src="../assets/perf-score-format.js"></script>
  <script src="../assets/perf-kr-hierarchy.js"></script>
  <script src="../assets/perf-sixq3j.js"></script>
  <script src="../assets/supervisor-score.js"></script>
  <script>SupervisorScore.initMpQuarterlyScorePage();</script>
  <script src="../assets/proto-notes-data.js"></script>
  <script src="../assets/proto-notes.js"></script>
</body>
</html>
