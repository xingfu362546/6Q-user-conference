<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>画像档案 · 6Q面谈官</title>
  <link rel="stylesheet" href="../6q-conference-prototype/css/6q-conference.css" />
  <link rel="stylesheet" href="../6q-conference-prototype/css/6q-profile.css" />
  <link rel="stylesheet" href="css/portal-tokens.css" />
  <link rel="stylesheet" href="css/portal-shell.css" />
  <link rel="stylesheet" href="css/portal-intent.css" />
  <link rel="stylesheet" href="../shared/intent-proto-notes.css" />
  <link rel="stylesheet" href="css/portal-conference-business.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    .portal-app .pf-toolbar__title .pf-ver { background: #f39800; }
    .portal-app #pfFollowStartBtn,
    .portal-app button[disabled][title*="跟进"] { display: none !important; }
  </style>
</head>
<body class="q-app portal-app iv-body" data-cf-page="students">
  <header class="iv-topbar" id="portal-topbar"></header>

  <div class="iv-portal-main">
    <main class="q-page" style="max-width:1280px;margin:0 auto;padding:16px 20px 48px">
      <div class="pf-toolbar">
        <div class="pf-toolbar__left">
          <a class="q-btn" href="student-intent.html">← 返回学员列表</a>
          <h1 class="pf-toolbar__title">
            画像档案
            <span class="pf-ver">v1.2.4</span>
          </h1>
          <span class="pf-toolbar__ctx" id="ctxLine">会员全局档案 · 面谈官只读</span>
        </div>
        <div class="q-actions">
          <button type="button" class="q-btn" id="pfAiOpenBtn">AI 分析对话</button>
        </div>
      </div>

      <div id="profileRoot"></div>
      <p class="pf-note" style="margin-top:8px">
        面谈官门户 v1.2.4：画像保持只读；大型分析助手含演示按钮、追问条与意图流注释。对话为 Mock，生产以 Dify 回传为准。
      </p>
    </main>
  </div>

  <script src="js/auth-mock.js"></script>
  <script src="js/conference-mock.js"></script>
  <script src="js/portal-shell.js"></script>
  <script>
    (function () {
      if (!InterviewerAuth.requireAuth("login.html")) return;
      InterviewerShell.mount({ containerSelector: "#portal-topbar", active: "profile" });
    })();
  </script>
  <script src="../6q-conference-prototype/js/conference-profile-data.js"></script>
  <script src="../6q-conference-prototype/js/conference-profile-behavior.js"></script>
  <script src="js/portal-business-notes-data.js"></script>
  <script src="js/portal-student-source.js"></script>
  <script src="js/portal-conference-business.js"></script>
  <script src="js/portal-student-profile.js"></script>
  <script src="../6q-conference-prototype/js/conference-student-profile.js"></script>
  <script>InterviewerStudentProfile.mount();</script>
  <script src="../6q-conference-prototype/js/conference-profile-assistant-core.js"></script>
  <script src="../6q-conference-prototype/js/conference-profile-assistant-mock.js"></script>
  <script>
    var portalOriginalGetConference = InterviewerAuth.getConference;
    InterviewerAuth.getConference = function () { return InterviewerStudentProfile.context; };
  </script>
  <script src="../6q-conference-prototype/js/conference-profile-ai-chat.js"></script>
  <script>InterviewerAuth.getConference = portalOriginalGetConference;</script>
  <script>
    (function () {
      var btn = document.getElementById("pfAiOpenBtn");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var fab = document.getElementById("pfAiFab");
        if (fab) fab.click();
      });
    })();
  </script>
</body>
</html>
