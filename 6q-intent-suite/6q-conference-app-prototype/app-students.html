<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>学员 · 会务 APP</title>
  <link rel="stylesheet" href="css/app-conference.css" />
  <link rel="stylesheet" href="css/ios-device.css" />
  <link rel="stylesheet" href="../shared/intent-proto-notes.css" />
</head>
<body class="app-body">
  <div class="phone-frame">
    <header class="app-nav">
      <div class="app-nav__row">
        <button type="button" class="app-nav__back" aria-label="返回">�?/button>
        <div class="app-nav__tabs">
          <span class="app-nav__tab is-active">学员</span>
          <span class="app-nav__tab">小组</span>
          <span class="app-nav__tab">座位</span>
        </div>
        <div class="app-nav__extra"></div>
      </div>
      <div class="app-search">
        <span class="app-search__icon">�?/span>
        <input type="search" placeholder="搜索学员、手机号码、小组、签到号、跟进助�? id="searchInput" />
      </div>
    </header>

    <a href="app-intent-scan.html" class="ai-entry-banner" id="aiEntry" data-href-scan="app-intent-scan.html" data-href-dash="app-intent-dashboard.html">
      <div class="ai-entry-banner__icon">�?/div>
      <div class="ai-entry-banner__text">
        <div class="ai-entry-banner__title">
          AI 意向洞察
          <span class="ai-entry-banner__badge">智能分析</span>
        </div>
        <div class="ai-entry-banner__desc">基于会务后台策略，自动分析本期学员高/�?低意向分�?/div>
      </div>
      <span class="ai-entry-banner__arrow">�?/span>
    </a>

    <p class="app-meta" id="studentCount">学员人数：�?/p>

    <div class="student-scroll" id="studentList"></div>

    <div class="fab-stack">
      <button type="button" class="fab-btn fab-btn--blue">自动分配跟进助教</button>
      <button type="button" class="fab-btn fab-btn--orange">会务跟进</button>
    </div>

    <nav class="app-tabbar">
      <a class="app-tabbar__item" href="#"><span class="app-tabbar__icon">💼</span>工作</a>
      <a class="app-tabbar__item is-active" href="app-students.html"><span class="app-tabbar__icon">👥</span>学员</a>
      <a class="app-tabbar__item" href="home.html"><span class="app-tabbar__icon">�?/span>原型</a>
    </nav>
  </div>

  <script src="js/tag-catalog-tree.js"></script>
  <script src="js/app-intent-core.js"></script>
  <script>
    (function () {
      var listEl = document.getElementById("studentList");
      var searchEl = document.getElementById("searchInput");
      var countEl = document.getElementById("studentCount");

      function render(q) {
        var students = window.AppIntent.getAll();
        if (q) {
          q = q.toLowerCase();
          students = students.filter(function (s) {
            return (
              s.name.indexOf(q) >= 0 ||
              s.phone.indexOf(q) >= 0
            );
          });
        }
        countEl.textContent = "学员人数�? + students.length;
        listEl.innerHTML = students
          .map(function (s) {
            var tags = [s.trainTag, s.roleTag].filter(Boolean);
            var tagHtml = tags
              .map(function (t) {
                return '<span class="student-tag">' + t + "</span>";
              })
              .join("");
            return (
              '<div class="student-row">' +
              '<div class="student-row__avatar student-row__avatar--placeholder" style="background:' +
              window.AppIntent.avatarGradient(s.id) +
              '">' +
              s.name.charAt(0) +
              "</div>" +
              '<div class="student-row__main">' +
              '<div class="student-row__name-line">' +
              '<span class="student-row__name">' +
              s.name +
              "</span>" +
              tagHtml +
              "</div>" +
              '<div class="student-row__phone">手机号码�? +
              s.phone +
              "</div>" +
              "</div>" +
              '<button type="button" class="student-row__call" aria-label="拨打电话">📞</button>' +
              "</div>"
            );
          })
          .join("");
      }

      searchEl.addEventListener("input", function () {
        render(searchEl.value.trim());
      });

      render("");

      var entry = document.getElementById("aiEntry");
      var forceScan =
        window.AppIntent.shouldForceRescan && window.AppIntent.shouldForceRescan();
      if (window.AppIntent.CONFIG.analyzedAt && !forceScan) {
        entry.href = entry.dataset.hrefDash;
        entry.querySelector(".ai-entry-banner__desc").textContent =
          "最近分�?" +
          window.AppIntent.formatAnalyzedTime() +
          " · 点击查看意向中控";
      } else {
        entry.href = entry.dataset.hrefScan;
      }
    })();
  </script>
  <script src="js/ios-wrap.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="../index-features.js"></script>
  <script src="../shared/intent-proto-enrich.js"></script>
  <script src="../shared/intent-proto-pages.js"></script>
  <script src="../shared/intent-proto-architecture.js"></script>
  <script src="../shared/intent-proto-notes.js"></script>
</body>
</html>
