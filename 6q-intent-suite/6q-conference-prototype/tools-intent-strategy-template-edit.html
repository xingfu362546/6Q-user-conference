<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>编辑分析策略模板 · 会务工具 · 6Q 原型</title>
  <link rel="stylesheet" href="css/6q-conference.css" />
  <link rel="stylesheet" href="css/6q-intent-premium.css" />
  <link rel="stylesheet" href="../shared/intent-proto-notes.css" />
</head>
<body class="q-app intent-theme" data-cf-page="template-edit" data-tool-page="intent-template">
  <header id="q-topbar-mount"></header>
  <div class="q-body">
    <aside id="q-sidenav-mount" class="q-sidenav"></aside>
    <div class="q-main">
      <nav id="q-doc-tabs-mount" class="q-doc-tabs"></nav>
      <div class="q-breadcrumb">
        <a href="tools-intent-strategy-template.html">分析策略模板</a> / <strong>编辑模板</strong>
      </div>
      <div class="q-content-wrap q-content-wrap--no-sub">
        <main class="q-page">
          <section class="intent-tools-head">
            <div>
              <h1 class="intent-tools-head__title" id="tpl-edit-title">编辑模板</h1>
              <p class="intent-tools-head__sub">配置关注标签与意向度规则，供各期会务选用</p>
            </div>
            <div class="intent-hero__actions">
              <a class="q-btn" href="tools-intent-strategy-template.html">返回列表</a>
              <button type="button" class="q-btn intent-btn-danger" id="btn-delete-template" hidden>删除模板</button>
              <button type="button" class="q-btn q-btn--primary" id="btn-save-template">保存模板</button>
            </div>
          </section>

          <div class="intent-field" style="margin:0 20px 16px">
            <label class="intent-field__label" for="tpl-name">模板名称</label>
            <input class="q-input" id="tpl-name" type="text" style="max-width:420px" />
          </div>
          <div class="intent-field" style="margin:0 20px 20px">
            <label class="intent-field__label" for="tpl-desc">说明</label>
            <input class="q-input" id="tpl-desc" type="text" style="max-width:560px" />
          </div>

          <div class="intent-workspace intent-workspace--config-single">
            <aside class="intent-config intent-config--wide" aria-label="策略配置">
              <div class="intent-panel">
                <div class="intent-panel__head">
                  <h2 class="intent-panel__title"><span class="intent-panel__step">1</span>关注标签 · 列表筛选</h2>
                </div>
                <div class="intent-panel__body">
                  <p class="intent-field__hint" style="margin:0 0 12px">
                    从平台<strong>系统标签</strong>（一级分类 / 二级标签）中选择；点击区域打开标签树，支持多选。
                  </p>
                  <div class="intent-chip-area intent-chip-area--pick" data-pick="watch" id="watch-chips" tabindex="0"></div>
                  <div class="intent-logic-row">
                    <span class="intent-field__label" style="margin:0">逻辑</span>
                    <select class="q-select" id="watch-logic">
                      <option value="any">命中任一</option>
                      <option value="all">命中全部</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="intent-panel">
                <div class="intent-panel__head">
                  <h2 class="intent-panel__title"><span class="intent-panel__step">2</span>意向度配置</h2>
                </div>
                <div class="intent-panel__body">
                  <p class="intent-field__hint" style="margin:0 0 12px">
                    二选一：<strong>按权重分</strong>（标签权重 + AI 分阈值）或<strong>按命中标签</strong>（高/中/低组合判定）。
                  </p>
                  <div class="intent-mode-switch" role="radiogroup">
                    <label class="intent-mode-switch__item">
                      <input type="radio" name="intent-mode" value="score" checked />
                      <span>按权重分</span>
                    </label>
                    <label class="intent-mode-switch__item">
                      <input type="radio" name="intent-mode" value="tags" />
                      <span>按命中标签</span>
                    </label>
                  </div>
                  <div id="intent-config-score" class="intent-config-block">
                    <div class="intent-threshold intent-threshold--high">
                      <label class="intent-threshold__label" for="threshold-high">高意向 · 总分 ≥</label>
                      <input class="intent-threshold__input" type="number" id="threshold-high" min="0" max="200" value="70" />
                      <span class="intent-threshold__unit">分</span>
                    </div>
                    <div class="intent-threshold intent-threshold--mid">
                      <label class="intent-threshold__label" for="threshold-mid">中意向 · 总分 ≥</label>
                      <input class="intent-threshold__input" type="number" id="threshold-mid" min="0" max="200" value="45" />
                      <span class="intent-threshold__unit">分</span>
                    </div>
                    <div class="intent-threshold intent-threshold--low">
                      <label class="intent-threshold__label" for="threshold-low">低意向 · 总分 ≥</label>
                      <input class="intent-threshold__input" type="number" id="threshold-low" min="0" max="200" value="25" />
                      <span class="intent-threshold__unit">分</span>
                    </div>
                  </div>
                  <div id="intent-config-tags" class="intent-config-block" hidden>
                    <div class="intent-level intent-level--high">
                      <div class="intent-level__head">
                        <span class="intent-level__name">高意向</span>
                        <select class="q-select intent-level__logic" id="high-logic">
                          <option value="all">全部命中</option>
                          <option value="any">任一命中</option>
                        </select>
                      </div>
                      <div class="intent-chip-area intent-chip-area--pick" data-pick="high" id="high-chips" tabindex="0"></div>
                    </div>
                    <div class="intent-level intent-level--mid">
                      <div class="intent-level__head">
                        <span class="intent-level__name">中意向</span>
                        <select class="q-select intent-level__logic" id="mid-logic">
                          <option value="all">全部命中</option>
                          <option value="any">任一命中</option>
                        </select>
                      </div>
                      <div class="intent-chip-area intent-chip-area--pick" data-pick="mid" id="mid-chips" tabindex="0"></div>
                    </div>
                    <div class="intent-level intent-level--low">
                      <div class="intent-level__head">
                        <span class="intent-level__name">低意向</span>
                        <select class="q-select intent-level__logic" id="low-logic">
                          <option value="any">任一命中</option>
                          <option value="all">全部命中</option>
                        </select>
                      </div>
                      <div class="intent-chip-area intent-chip-area--pick" data-pick="low" id="low-chips" tabindex="0"></div>
                    </div>
                  </div>
                </div>
              </div>
            </aside>
          </div>
        </main>
      </div>
    </div>
  </div>

  <div class="q-modal-backdrop" id="picker-modal">
    <div class="q-modal q-modal--tree" role="dialog" aria-labelledby="picker-title">
      <div class="q-modal__head" id="picker-title">选择标签</div>
      <div class="q-modal__body" id="picker-list"></div>
      <div class="q-modal__foot">
        <button type="button" class="q-btn" id="picker-cancel">取消</button>
        <button type="button" class="q-btn q-btn--primary" id="picker-ok">确定</button>
      </div>
    </div>
  </div>

  <div class="q-toast" id="toast" role="status"></div>

  <script src="js/6q-shell.js"></script>
  <script src="js/tag-catalog-tree.js"></script>
  <script src="js/intent-strategy-core.js"></script>
  <script src="js/conference-intent.js"></script>
  <script src="js/tools-intent-strategy-template-edit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="../index-features.js"></script>
  <script src="../shared/intent-proto-enrich.js"></script>
  <script src="../shared/intent-proto-pages.js"></script>
  <script src="../shared/intent-proto-architecture.js"></script>
  <script src="../shared/intent-proto-notes.js"></script>
</body>
</html>
