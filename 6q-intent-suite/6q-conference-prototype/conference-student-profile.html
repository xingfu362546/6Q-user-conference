<!DOCTYPE html>

<body class="q-app" data-shell="member" data-cf-page="member-detail">
  <header id="q-topbar-mount"></header>

        用户管理 /
        会员管理 /
        <strong>会员详情</strong>

      <div class="q-content-wrap">
        <nav id="q-subnav-mount" class="q-subnav" aria-label="会员详情子菜单"></nav>
        <main class="q-page">
          <div class="pf-toolbar">
            <div class="pf-toolbar__left">

          <p class="pf-note" style="margin-top:8px">

            <a href="versions.html#v104">版本说明</a>
