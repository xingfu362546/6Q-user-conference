<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>砍价成功 · 文化语录区</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #e8eaed;
      --surface: #ffffff;
      --text-primary: #1a1a1e;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --accent-red: #e02424;
      --accent-orange: #ff6a00;
      --accent-orange-deep: #e85f00;
      --border-subtle: rgba(15, 23, 42, 0.08);
      --quote-bg: linear-gradient(145deg, #fffbf7 0%, #fff5eb 48%, #faf8f5 100%);
      --quote-border: rgba(255, 106, 0, 0.22);
      --quote-ink: #3d3429;
      --quote-accent: #c45c26;
      --shadow-modal: 0 24px 48px rgba(15, 23, 42, 0.12), 0 8px 16px rgba(15, 23, 42, 0.06);
      --radius-modal: 20px;
      --radius-pill: 999px;
      --font-ui: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-quote: "Noto Serif SC", "Songti SC", "STSong", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: var(--font-ui);
      color: var(--text-primary);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(255, 106, 0, 0.08), transparent 55%),
        var(--bg-page);
      -webkit-font-smoothing: antialiased;
    }

    .phone {
      width: min(360px, 100%);
      perspective: 1200px;
    }

    .modal {
      position: relative;
      background: var(--surface);
      border-radius: var(--radius-modal);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-modal);
      padding: 28px 22px 22px;
      overflow: hidden;
    }

    .modal::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 90% 45% at 50% 0%, rgba(255, 106, 0, 0.06), transparent 70%);
      pointer-events: none;
    }

    .close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.04);
      color: var(--text-secondary);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      z-index: 2;
    }

    .close:hover {
      background: rgba(15, 23, 42, 0.08);
      color: var(--text-primary);
    }

    .close:active {
      transform: scale(0.94);
    }

    .close svg {
      width: 16px;
      height: 16px;
    }

    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      padding-top: 8px;
      z-index: 1;
    }

    .avatar-wrap {
      position: relative;
      width: 88px;
      height: 88px;
    }

    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 210deg, #ff6a00, #ffb347, #ff6a00);
      opacity: 0.35;
      filter: blur(0.5px);
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(160deg, #dbeafe 0%, #bfdbfe 45%, #93c5fd 100%);
      border: 3px solid #fff;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.2);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .avatar svg {
      width: 52px;
      height: 52px;
      opacity: 0.9;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.45;
      color: var(--text-primary);
    }

    .title .amount {
      color: var(--accent-red);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .subtitle {
      margin: 0;
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-secondary);
      max-width: 260px;
    }

    /* —— 文化输出 / 名人名言承载区（2~3 行 + 出处） —— */
    .cultural-slot {
      position: relative;
      margin: 20px 0 4px;
      padding: 16px 16px 14px 18px;
      border-radius: 14px;
      background: var(--quote-bg);
      border: 1px solid rgba(255, 106, 0, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
      z-index: 1;
    }

    .cultural-slot::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 3px;
      border-radius: 3px;
      background: linear-gradient(180deg, var(--accent-orange), var(--quote-accent));
      opacity: 0.85;
    }

    .cultural-slot .deco {
      position: absolute;
      top: 8px;
      right: 12px;
      font-family: "DM Serif Display", "Noto Serif SC", serif;
      font-size: 42px;
      line-height: 1;
      color: rgba(196, 92, 38, 0.12);
      pointer-events: none;
      user-select: none;
    }

    .cultural-slot .label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--quote-accent);
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .cultural-slot .label span.dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-orange);
      box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.2);
    }

    .quote-body {
      margin: 0;
      font-family: var(--font-quote);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.75;
      color: var(--quote-ink);
      text-align: left;
      padding-right: 8px;
    }

    .quote-body .line {
      display: block;
    }

    .cta-wrap {
      position: relative;
      margin-top: 18px;
      z-index: 1;
    }

    .cta {
      width: 100%;
      border: none;
      border-radius: var(--radius-pill);
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(180deg, var(--accent-orange) 0%, var(--accent-orange-deep) 100%);
      box-shadow:
        0 10px 24px rgba(255, 106, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    .cta:hover {
      filter: brightness(1.03);
      box-shadow:
        0 12px 28px rgba(255, 106, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .cta:active {
      transform: translateY(1px) scale(0.99);
    }

  </style>
</head>
<body>
  <div class="phone">
    <div class="modal" role="dialog" aria-labelledby="modal-title" aria-modal="true">
      <button type="button" class="close" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>

      <div class="hero">
        <div class="avatar-wrap">
          <div class="avatar-ring" aria-hidden="true"></div>
          <div class="avatar" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="22" cy="24" r="6" fill="#1d4ed8" opacity="0.35" />
              <path d="M8 44c4-12 12-18 24-18s20 6 24 18" stroke="#1e40af" stroke-width="3" stroke-linecap="round" />
              <circle cx="48" cy="18" r="5" fill="#fbbf24" />
            </svg>
          </div>
        </div>

        <h1 id="modal-title" class="title">
          谢谢你帮我，砍掉 <span class="amount">12.12元</span>
        </h1>
        <p class="subtitle">
          您也可以参与砍价活动哦～<br />
          快去邀请好友砍价吧～
        </p>
      </div>

      <!-- 文化输出：替换 .quote-body 文案即可；版式约 2~3 行正文 -->
      <section class="cultural-slot" aria-label="6Q经句分享">
        <span class="deco" aria-hidden="true">“</span>
        <div class="label"><span class="dot" aria-hidden="true"></span>6Q经句分享：</div>
        <p class="quote-body">
          <span class="line">赠人玫瑰，手有余香。</span>
          <span class="line">每一次相助，都是生活里温柔的一笔。</span>
        </p>
      </section>

      <div class="cta-wrap">
        <button type="button" class="cta">邀请好友砍价</button>
      </div>
    </div>
  </div>
</body>
</html>
