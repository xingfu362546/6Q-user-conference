<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>权益特权</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f3f4f8; --card:#fff; --text:#141826; --sub:#6b7289; --vip:#5b4bdb; --line:#e8eaf2; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans SC",sans-serif;background:#c4c6d4;display:flex;justify-content:center;padding:20px 10px 40px;min-height:100vh}
    .phone{width:100%;max-width:390px;background:var(--bg);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.2);min-height:720px;overflow:hidden}
    .nav{display:flex;align-items:center;padding:12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
    .nav a{color:var(--text);text-decoration:none;font-size:22px;padding:4px 10px}
    .nav h1{flex:1;text-align:center;font-size:17px;font-weight:600}
    .body{padding:14px}
    .acc{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;margin-bottom:10px}
    .acc-h{display:flex;justify-content:space-between;align-items:center;padding:14px;cursor:pointer;font-weight:600;font-size:15px}
    .acc-h span{color:var(--sub);font-size:20px;transition:transform .2s}
    .acc.open .acc-h span{transform:rotate(180deg)}
    .acc-b{display:none;padding:0 14px 14px;font-size:13px;color:var(--sub);line-height:1.65;border-top:1px solid var(--line)}
    .acc.open .acc-b{display:block;padding-top:12px}
    .nav-extra{display:flex;gap:10px;align-items:center;font-size:12px}
    .nav-extra a{color:#ff7a45;text-decoration:none;font-weight:600}
    .nav-extra a.dim{color:#888;font-weight:400}
  </style>
</head>
<body>
  <div class="phone">
    <header class="nav">
      <a href="m-home.html">‹</a>
      <h1>权益特权</h1>
      <span class="nav-extra"><a href="m-home.html">汇总</a><a href="app-mine.html" class="dim">我的</a></span>
    </header>
    <div class="body">
      <div class="acc open">
        <div class="acc-h">形象与界面 <span>⌄</span></div>
        <div class="acc-b">1. 专属会员头像框<br>2. 专属会员 UI 皮肤（列表、我的页主题）</div>
      </div>
      <div class="acc">
        <div class="acc-h">活动与渠道 <span>⌄</span></div>
        <div class="acc-b">3. 线下 / 线上活动申请的优待通道（报名优先、审核加速等，可配置）</div>
      </div>
      <div class="acc">
        <div class="acc-h">板块功能权益 <span>⌄</span></div>
        <div class="acc-b">4. 不同业务板块（直播、社区、课程等）按档位解锁功能入口与配额</div>
      </div>
      <div class="acc">
        <div class="acc-h">课程卡权益 <span>⌄</span></div>
        <div class="acc-b">5. 部分档位可获得不同面额 / 次数的课程卡，用于兑换指定商品</div>
      </div>
    </div>
  </div>
  <script>
    document.querySelectorAll('.acc').forEach(box => {
      box.querySelector('.acc-h').addEventListener('click', () => {
        const open = box.classList.toggle('open');
        document.querySelectorAll('.acc').forEach(o => { if (o !== box) o.classList.remove('open'); });
      });
    });
  </script>
</body>
</html>
