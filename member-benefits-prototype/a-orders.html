<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台 · 虚拟商品订单</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f1f5f9; --card:#fff; --text:#0f172a; --sub:#64748b; --pri:#4f46e5; --line:#e2e8f0; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--text)}
    header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
    header h1{font-size:18px}
    header a{color:var(--pri);text-decoration:none;font-size:14px}
    main{max-width:1200px;margin:0 auto;padding:20px 24px 40px}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
    select,input{padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-family:inherit;font-size:13px}
    table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    th,td{padding:11px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
    th{background:#f8fafc;color:var(--sub);font-weight:600}
    a.link{color:var(--pri);cursor:pointer;text-decoration:underline}
    tr:hover td{background:#fafafa}
  </style>
</head>
<body>
  <header>
    <h1>虚拟商品订单</h1>
    <a href="index.html">← 原型导航</a>
  </header>
  <main>
    <p style="font-size:13px;color:var(--sub);margin-bottom:12px">清单：沿用原有订单流程，增加<strong>权益订单来源 / 渠道</strong>字段。</p>
    <div class="filters">
      <label>状态</label>
      <select id="st"><option value="all">全部</option><option value="paid">已支付</option><option value="refund">退款中</option><option value="done">已完成</option></select>
      <label>来源</label>
      <select id="src"><option value="all">全部</option><option value="subscribe">会员订阅</option><option value="redeem">兑换码</option><option value="gift">赠送 / 裂变</option></select>
    </div>
    <table>
      <thead>
        <tr><th>订单号</th><th>用户</th><th>商品</th><th>金额</th><th>状态</th><th>权益来源</th><th>渠道</th><th>操作</th></tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
  </main>
  <script>
    const orders = [
      { id:'ORD202605070001', user:'U100860', sku:'6Q 高级会员 · 年卡', amt:598, st:'paid', src:'subscribe', ch:'小程序' },
      { id:'ORD202605060812', user:'U100902', sku:'AI 数字人 · 次数包', amt:0, st:'done', src:'gift', ch:'会员权益页' },
      { id:'ORD202605051003', user:'U100110', sku:'6Q 会员 · 月卡', amt:29, st:'refund', src:'redeem', ch:'活动落地页' },
    ];
    const tb = document.getElementById('tb');
    function render() {
      const fs = document.getElementById('st').value;
      const fr = document.getElementById('src').value;
      tb.innerHTML = orders.filter(o => (fs==='all'||o.st===fs) && (fr==='all'||o.src===fr)).map(o => {
        const srcMap = { subscribe:'会员订阅', redeem:'兑换码', gift:'赠送/裂变' };
        const stMap = { paid:'已支付', refund:'退款中', done:'已完成' };
        return `<tr><td>${o.id}</td><td>${o.user}</td><td>${o.sku}</td><td>¥${o.amt}</td><td>${stMap[o.st]}</td><td>${srcMap[o.src]}</td><td>${o.ch}</td><td><span class="link" data-id="${o.id}">详情</span></td></tr>`;
      }).join('');
      tb.querySelectorAll('.link').forEach(el => el.addEventListener('click', () => alert('原型：跳转订单详情 ' + el.dataset.id)));
    }
    document.getElementById('st').addEventListener('change', render);
    document.getElementById('src').addEventListener('change', render);
    render();
  </script>
</body>
</html>
