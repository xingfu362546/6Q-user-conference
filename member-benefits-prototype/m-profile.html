<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>我的 · 专属样式</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f3f4f8; --card:#fff; --text:#141826; --sub:#6b7289; --vip:#5b4bdb; --line:#e8eaf2; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans SC",sans-serif;background:#c4c6d4;display:flex;justify-content:center;padding:20px 10px 40px;min-height:100vh}
    .phone{width:100%;max-width:390px;background:var(--bg);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.2);min-height:760px;overflow:hidden}
    .nav{display:flex;align-items:center;padding:12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
    .nav a{color:var(--text);text-decoration:none;font-size:22px;padding:4px 10px}
    .nav h1{flex:1;text-align:center;font-size:17px;font-weight:600}
    .head{background:linear-gradient(180deg,#eef2ff,#f3f4f8);padding:20px 16px 16px;text-align:center;border-bottom:1px solid var(--line)}
    .avatar-wrap{position:relative;display:inline-block}
    .avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);border:3px solid #fff;box-shadow:0 8px 24px rgba(99,102,241,.3)}
    .frame{position:absolute;inset:-8px;border-radius:50%;border:3px solid #fbbf24;pointer-events:none}
    .nick{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:18px;font-weight:700;color:#4c1d95}
    .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:999px;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#422006;font-weight:800}
    .sub{margin-top:6px;font-size:12px;color:var(--sub)}
    .section{padding:14px}
    .section h3{font-size:14px;margin-bottom:10px}
    .post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
    .post .who{display:flex;align-items:center;gap:8px;font-weight:600}
    .name-vip{color:#7c3aed}
    .name-super{color:#b45309}
    .ico{font-size:14px}
    .post p{margin-top:8px;font-size:14px;color:var(--text);line-height:1.55}
    .reply{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--sub)}
    .reply strong.name-vip,.reply strong.name-super{font-weight:700}
    .nav-extra{display:flex;gap:10px;align-items:center;font-size:12px}
    .nav-extra a{color:#ff7a45;text-decoration:none;font-weight:600}
    .nav-extra a.dim{color:#888;font-weight:400}
  </style>
</head>
<body>
  <div class="phone">
    <header class="nav">
      <a href="m-home.html">‹</a>
      <h1>我的</h1>
      <span class="nav-extra"><a href="m-home.html">汇总</a><a href="app-mine.html" class="dim">我的</a></span>
    </header>
    <div class="head">
      <div class="avatar-wrap">
        <div class="avatar"></div>
        <div class="frame"></div>
      </div>
      <div class="nick">紫藤家长 <span class="badge">6Q 高级</span></div>
      <p class="sub">清单：我的页权益标识；话题 / 问题 / 回复的名字换色与图标</p>
    </div>
    <div class="section">
      <h3>社区动态示意</h3>
      <div class="post">
        <div class="who"><span class="name-vip">李老师谈育儿</span><span class="ico">✦</span><span class="badge" style="font-size:10px">会员</span></div>
        <p>孩子拖延往往不是懒，而是任务颗粒度太大……</p>
        <div class="reply"><strong class="name-super">超级会员_阿木</strong><span class="ico">👑</span>：附议，拆解任务很有效。</div>
      </div>
      <div class="post">
        <div class="who">普通用户</div>
        <p>没有权益时使用默认昵称色与无角标。</p>
      </div>
    </div>
  </div>
</body>
</html>
