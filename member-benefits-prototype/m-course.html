<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>线上课程 · 观看权益</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f3f4f8; --card:#fff; --text:#141826; --sub:#6b7289; --vip:#5b4bdb; --line:#e8eaf2; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans SC",sans-serif;background:#c4c6d4;display:flex;justify-content:center;padding:20px 10px 40px;min-height:100vh}
    .phone{width:100%;max-width:390px;background:var(--bg);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.2);min-height:720px;overflow:hidden}
    .nav{display:flex;align-items:center;padding:12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
    .nav a{color:var(--text);text-decoration:none;font-size:22px;padding:4px 10px}
    .nav h1{flex:1;text-align:center;font-size:17px;font-weight:600}
    .filter{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;background:var(--bg)}
    .filter button{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:999px;font-size:12px;cursor:pointer;color:var(--sub)}
    .filter button.on{border-color:#818cf8;color:var(--vip);background:#eef2ff;font-weight:600}
    .list{padding:0 14px 20px}
    .row{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
    .row:hover{box-shadow:0 6px 20px rgba(99,102,241,.12)}
    .thumb{width:100px;height:64px;border-radius:10px;background:linear-gradient(135deg,#bfdbfe,#93c5fd);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
    .info{flex:1;min-width:0}
    .info h4{font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .info .meta{font-size:11px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .tag{font-size:10px;padding:2px 6px;border-radius:4px;background:#dcfce7;color:#166534;font-weight:700;border:1px solid #86efac}
    .tag.partial{background:#fef9c3;color:#854d0e;border-color:#fde047}
    .price{font-size:13px;font-weight:700;color:var(--text)}
    .price.free{color:#059669}
    .nav-extra{display:flex;gap:10px;align-items:center;font-size:12px}
    .nav-extra a{color:#ff7a45;text-decoration:none;font-weight:600}
    .nav-extra a.dim{color:#888;font-weight:400}
  </style>
</head>
<body>
  <div class="phone">
    <header class="nav">
      <a href="m-home.html">‹</a>
      <h1>线上课程</h1>
      <span class="nav-extra"><a href="m-home.html">汇总</a><a href="app-mine.html" class="dim">我的</a></span>
    </header>
    <div class="filter" id="tier">
      <button type="button" class="on" data-tier="base">6Q 会员</button>
      <button type="button" data-tier="plus">高级会员</button>
      <button type="button" data-tier="super">超级会员</button>
    </div>
    <div class="list" id="list"></div>
  </div>
  <script>
    const courses = [
      { t:'沟通力入门', price:99, base:false, plus:true, super:true, icon:'💬' },
      { t:'青春期心理', price:199, base:false, plus:'partial', super:true, icon:'🧠' },
      { t:'家庭规则共建', price:49, base:true, plus:true, super:true, icon:'📌' },
      { t:'学习方法实战', price:299, base:false, plus:false, super:true, icon:'📈' },
    ];
    let tier = 'base';
    function tagFor(c) {
      const v = c[tier];
      if (v === true) return '<span class="tag">权益免费看</span>';
      if (v === 'partial') return '<span class="tag partial">高级：部分课节</span>';
      return '';
    }
    function priceFor(c) {
      const v = c[tier];
      if (v === true) return '<span class="price free">¥0</span>';
      if (v === 'partial' && tier === 'plus') return '<span class="price">部分免费</span>';
      return '<span class="price">¥'+c.price+'</span>';
    }
    function render() {
      const el = document.getElementById('list');
      el.innerHTML = courses.map(c => `
        <div class="row">
          <div class="thumb">${c.icon}</div>
          <div class="info">
            <h4>${c.t}</h4>
            <div class="meta">${tagFor(c)}<span>原价 ¥${c.price}</span></div>
            <div class="meta" style="margin-top:6px">${priceFor(c)}</div>
          </div>
        </div>`).join('');
    }
    document.querySelectorAll('#tier button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#tier button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        tier = b.dataset.tier;
        render();
      });
    });
    render();
  </script>
</body>
</html>
