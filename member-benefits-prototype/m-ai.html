<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>AI 数字人 · 视频生成权益</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f3f4f8; --card:#fff; --text:#141826; --sub:#6b7289; --vip:#5b4bdb; --line:#e8eaf2; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans SC",sans-serif;background:#c4c6d4;display:flex;justify-content:center;padding:20px 10px 40px;min-height:100vh}
    .phone{width:100%;max-width:390px;background:var(--bg);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.2);min-height:720px;overflow:hidden;position:relative}
    .nav{display:flex;align-items:center;padding:12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
    .nav a{color:var(--text);text-decoration:none;font-size:22px;padding:4px 10px}
    .nav h1{flex:1;text-align:center;font-size:17px;font-weight:600}
    .hero{padding:24px 16px;background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;text-align:center}
    .hero h2{font-size:18px;margin-bottom:8px}
    .hero p{font-size:13px;opacity:.9;line-height:1.6}
    .box{margin:-20px 14px 0;position:relative;z-index:1;background:var(--card);border-radius:16px;border:1px solid var(--line);padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.08)}
    .stat{display:flex;justify-content:space-around;text-align:center;margin-bottom:16px}
    .stat div strong{display:block;font-size:22px;color:var(--vip)}
    .stat div span{font-size:12px;color:var(--sub)}
    .btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;background:linear-gradient(90deg,#6366f1,#8b5cf6);color:#fff}
    .overlay{display:none;position:fixed;inset:0;background:rgba(15,18,33,.55);z-index:50;align-items:flex-end;justify-content:center;padding:16px}
    .overlay.show{display:flex}
    .sheet{width:100%;max-width:390px;background:var(--card);border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}
    @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
    .sheet h3{margin-bottom:8px}
    .sheet p{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:14px}
    .qr{height:140px;border-radius:12px;background:repeating-linear-gradient(45deg,#e5e7eb,#e5e7eb 8px,#f3f4f6 8px,#f3f4f6 16px);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;margin-bottom:12px;border:1px dashed var(--line)}
    .close{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
    .nav-extra{display:flex;gap:10px;align-items:center;font-size:12px}
    .nav-extra a{color:#ff7a45;text-decoration:none;font-weight:600}
    .nav-extra a.dim{color:#888;font-weight:400}
  </style>
</head>
<body>
  <div class="phone">
    <header class="nav">
      <a href="m-home.html">‹</a>
      <h1>AI 数字人权益</h1>
      <span class="nav-extra"><a href="m-home.html">汇总</a><a href="app-mine.html" class="dim">我的</a></span>
    </header>
    <div class="hero">
      <h2>视频生成次数</h2>
      <p>清单：权益次数在权益页领取；点击后弹出添加好友等方式获取服务。</p>
    </div>
    <div class="box">
      <div class="stat">
        <div><strong>3</strong><span>本月剩余</span></div>
        <div><strong>10</strong><span>累计已领</span></div>
      </div>
      <button type="button" class="btn" id="claim">领取 / 兑换次数</button>
    </div>
  </div>
  <div class="overlay" id="modal">
    <div class="sheet">
      <h3>添加专属顾问</h3>
      <p>请使用微信扫描下方二维码，备注「6Q 会员 + 手机号后四位」，顾问将为您开通生成配额（原型占位）。</p>
      <div class="qr">二维码占位</div>
      <button type="button" class="close" id="closeModal">我知道了</button>
    </div>
  </div>
  <script>
    const m = document.getElementById('modal');
    document.getElementById('claim').addEventListener('click', () => m.classList.add('show'));
    document.getElementById('closeModal').addEventListener('click', () => m.classList.remove('show'));
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
  </script>
</body>
</html>
