<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>权益开通</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f3f4f8; --card:#fff; --text:#141826; --sub:#6b7289; --vip:#5b4bdb; --line:#e8eaf2; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans SC",sans-serif;background:#c4c6d4;min-height:100vh;display:flex;justify-content:center;padding:20px 10px 40px}
    .phone{width:100%;max-width:390px;background:var(--bg);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.2);overflow:hidden;display:flex;flex-direction:column;min-height:760px}
    .nav{display:flex;align-items:center;padding:12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
    .nav a{color:var(--text);text-decoration:none;font-size:22px;padding:4px 10px}
    .nav h1{flex:1;text-align:center;font-size:17px;font-weight:600}
    .body{padding:14px 14px 24px;flex:1}
    .toggle-wrap{display:flex;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--line);margin-bottom:16px}
    .toggle-wrap button{flex:1;border:none;padding:10px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;background:transparent;color:var(--sub)}
    .toggle-wrap button.on{background:linear-gradient(90deg,#6366f1,#8b5cf6);color:#fff}
    .hint{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.5}
    .plan{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;cursor:pointer;transition:box-shadow .2s,border-color .2s}
    .plan.show{display:block}
    .plan.selected{border-color:#818cf8;box-shadow:0 0 0 2px rgba(99,102,241,.2)}
    .plan h3{font-size:16px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
    .plan .price{font-size:22px;font-weight:700;color:var(--vip)}
    .plan .price small{font-size:13px;font-weight:500;color:var(--sub)}
    ul{margin:10px 0 0 1.1em;font-size:13px;color:var(--sub);line-height:1.65}
    .cta{margin-top:18px}
    .cta button{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;background:linear-gradient(90deg,#6366f1,#8b5cf6);color:#fff}
    .toast{display:none;margin-top:10px;font-size:13px;color:#059669;text-align:center}
    .nav-extra{display:flex;gap:10px;align-items:center;font-size:12px}
    .nav-extra a{color:#ff7a45;text-decoration:none;font-weight:600}
    .nav-extra a.dim{color:#888;font-weight:400}
  </style>
</head>
<body>
  <div class="phone">
    <header class="nav">
      <a href="m-home.html">‹</a>
      <h1>开通会员</h1>
      <span class="nav-extra"><a href="m-home.html">汇总</a><a href="app-mine.html" class="dim">我的</a></span>
    </header>
    <div class="body">
      <p class="hint">清单：三档（6Q 会员 / 6Q 高级会员 / 6Q 超级会员）；支持<strong id="cycleLabel">月付</strong>与<strong>年付</strong>不同定价。</p>
      <div class="toggle-wrap">
        <button type="button" id="btnMonth" class="on">月付</button>
        <button type="button" id="btnYear">年付</button>
      </div>
      <div class="plan show" data-tier="base">
        <h3>6Q 会员 <span class="price" data-m="29" data-y="199"><span class="amt">¥29</span><small>/月</small></span></h3>
        <ul><li>基础头像框与标识</li><li>部分短视频免费看</li><li>积分商城基础权益价</li></ul>
      </div>
      <div class="plan show selected" data-tier="plus">
        <h3>6Q 高级会员 <span class="price" data-m="68" data-y="598"><span class="amt">¥68</span><small>/月</small></span></h3>
        <ul><li>专属 UI 与进阶头像框</li><li>更多板块功能权益</li><li>课程卡与活动优待</li></ul>
      </div>
      <div class="plan show" data-tier="super">
        <h3>6Q 超级会员 <span class="price" data-m="128" data-y="998"><span class="amt">¥128</span><small>/月</small></span></h3>
        <ul><li>全站付费短视频权益最大化</li><li>高阶课程免费额度</li><li>AI 数字人次数加成</li></ul>
      </div>
      <div class="cta">
        <button type="button" id="payBtn">模拟支付 · 开通所选档位</button>
        <p class="toast" id="toast">已记录选择（原型不写真实支付）</p>
      </div>
    </div>
  </div>
  <script>
    const btnMonth = document.getElementById('btnMonth');
    const btnYear = document.getElementById('btnYear');
    const cycleLabel = document.getElementById('cycleLabel');
    const plans = document.querySelectorAll('.plan');
    let yearly = false;
    function refreshPrices() {
      plans.forEach(p => {
        const pr = p.querySelector('.price');
        const m = pr.dataset.m, y = pr.dataset.y;
        const amt = p.querySelector('.amt');
        const small = pr.querySelector('small');
        if (yearly) { amt.textContent = '¥' + y; small.textContent = '/年'; }
        else { amt.textContent = '¥' + m; small.textContent = '/月'; }
      });
      cycleLabel.textContent = yearly ? '年付' : '月付';
    }
    btnMonth.addEventListener('click', () => { yearly = false; btnMonth.classList.add('on'); btnYear.classList.remove('on'); refreshPrices(); });
    btnYear.addEventListener('click', () => { yearly = true; btnYear.classList.add('on'); btnMonth.classList.remove('on'); refreshPrices(); });
    plans.forEach(p => p.addEventListener('click', () => { plans.forEach(x => x.classList.remove('selected')); p.classList.add('selected'); }));
    document.getElementById('payBtn').addEventListener('click', () => {
      const sel = document.querySelector('.plan.selected');
      const tier = sel?.dataset.tier || '';
      const t = document.getElementById('toast');
      t.style.display = 'block';
      t.textContent = '原型：已选择 ' + (yearly ? '年付' : '月付') + ' · 档位 ' + tier;
    });
    refreshPrices();
  </script>
</body>
</html>
