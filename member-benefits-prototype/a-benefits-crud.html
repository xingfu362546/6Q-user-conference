<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台 · 权益配置管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f1f5f9; --card:#fff; --text:#0f172a; --sub:#64748b; --pri:#4f46e5; --line:#e2e8f0; --danger:#dc2626; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
    header h1{font-size:18px}
    header a{color:var(--pri);text-decoration:none;font-size:14px}
    main{max-width:1200px;margin:0 auto;padding:20px 24px 40px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    button,.btn{border:none;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px;font-family:inherit}
    .btn-pri{background:var(--pri);color:#fff}
    .btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
    table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
    th,td{padding:12px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
    th{background:#f8fafc;color:var(--sub);font-weight:600}
    tr:hover td{background:#fafafa}
    .fixed{color:#b45309;font-weight:600}
    .ops{display:flex;gap:8px}
    .ops button{padding:6px 10px;font-size:12px;border-radius:6px;background:#eef2ff;color:var(--pri)}
    .ops button.del{color:var(--danger);background:#fef2f2}
    dialog{border:none;border-radius:14px;padding:0;max-width:480px;width:92%;box-shadow:0 24px 60px rgba(0,0,0,.2)}
    dialog::backdrop{background:rgba(15,23,42,.45)}
    .d-head{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700}
    .d-body{padding:16px 20px}
    .d-body label{display:block;margin:10px 0 4px;font-size:13px;font-weight:500}
    .d-body input,.d-body select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line)}
    .d-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  </style>
</head>
<body>
  <header>
    <h1>权益配置管理</h1>
    <a href="index.html">← 原型导航</a>
  </header>
  <main>
    <p style="font-size:13px;color:var(--sub);margin-bottom:14px">清单：支持权益增删改查；若为<strong>固定权益</strong>则隐藏「删」「增」。</p>
    <div class="toolbar">
      <button type="button" class="btn-pri" id="btnAdd">新建权益</button>
      <button type="button" class="btn-ghost" id="btnRefresh">刷新列表</button>
    </div>
    <table>
      <thead><tr><th>编码</th><th>名称</th><th>类型</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </main>
  <dialog id="dlg">
    <div class="d-head" id="dlgTitle">编辑权益</div>
    <div class="d-body">
      <label>权益名称</label>
      <input id="fName" type="text" />
      <label>类型</label>
      <select id="fType"><option value="可配置">可配置</option><option value="固定">固定</option></select>
      <label>状态</label>
      <select id="fStatus"><option>启用</option><option>停用</option></select>
    </div>
    <div class="d-foot">
      <button type="button" class="btn-ghost" id="dlgCancel">取消</button>
      <button type="button" class="btn-pri" id="dlgSave">保存</button>
    </div>
  </dialog>
  <script>
    let rows = [
      { code:'PRIV_UI', name:'专属 UI 皮肤', type:'固定', status:'启用' },
      { code:'PRIV_VIDEO', name:'短视频观看权益', type:'可配置', status:'启用' },
      { code:'PRIV_AI', name:'AI 数字人生成', type:'可配置', status:'启用' },
    ];
    let editIndex = -1;
    const tbody = document.getElementById('tbody');
    const dlg = document.getElementById('dlg');
    function render() {
      tbody.innerHTML = rows.map((r,i) => {
        const fixed = r.type === '固定';
        return `<tr>
          <td>${r.code}</td><td>${r.name}</td><td>${r.type}${fixed?' <span class="fixed">不可删</span>':''}</td><td>${r.status}</td>
          <td><div class="ops">
            <button type="button" data-a="edit" data-i="${i}">编辑</button>
            ${fixed ? '' : '<button type="button" class="del" data-a="del" data-i="'+i+'">删除</button>'}
          </div></td></tr>`;
      }).join('');
      tbody.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.i;
        if (b.dataset.a === 'del') { if (confirm('确认删除？')) { rows.splice(i,1); render(); } }
        if (b.dataset.a === 'edit') { openDlg(i); }
      }));
    }
    function openDlg(i) {
      editIndex = i;
      document.getElementById('dlgTitle').textContent = i < 0 ? '新建权益' : '编辑权益';
      if (i < 0) { fName.value=''; fType.value='可配置'; fStatus.value='启用'; fType.disabled=false; }
      else { const r = rows[i]; fName.value=r.name; fType.value=r.type; fStatus.value=r.status; fType.disabled = r.type==='固定'; }
      dlg.showModal();
    }
    const fName = document.getElementById('fName');
    const fType = document.getElementById('fType');
    const fStatus = document.getElementById('fStatus');
    document.getElementById('btnAdd').addEventListener('click', () => openDlg(-1));
    document.getElementById('btnRefresh').addEventListener('click', render);
    document.getElementById('dlgCancel').addEventListener('click', () => dlg.close());
    document.getElementById('dlgSave').addEventListener('click', () => {
      const name = fName.value.trim() || '未命名权益';
      if (editIndex < 0) rows.push({ code:'NEW_'+Date.now(), name, type:fType.value, status:fStatus.value });
      else { rows[editIndex] = { ...rows[editIndex], name, type:rows[editIndex].type==='固定'?'固定':fType.value, status:fStatus.value }; }
      dlg.close(); render();
    });
    render();
  </script>
</body>
</html>
