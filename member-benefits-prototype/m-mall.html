<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>积分商城</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --page: #f5f5f5;
      --card: #fff;
      --text: #1a1a1a;
      --sub: #8c8c8c;
      --accent: #ff7a45;
      --line: #ebebeb;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
      --vip-gold: #b45309;
      --ok: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: #c8c8c8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 10px 32px;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      background: var(--page);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
      min-height: 760px;
      display: flex;
      flex-direction: column;
    }
    .nav-wrap {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .nav {
      display: flex;
      align-items: center;
      padding: 8px 4px 6px 4px;
    }
    .nav a.back {
      color: var(--text);
      text-decoration: none;
      font-size: 24px;
      padding: 4px 10px;
      line-height: 1;
      font-weight: 300;
    }
    .tabs-main {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 4px;
      align-items: center;
    }
    .tabs-main button {
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 500;
      color: var(--sub);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
    }
    .tabs-main button.on {
      color: var(--text);
      font-weight: 700;
      background: rgba(255, 122, 69, 0.12);
    }
    .caps {
      display: flex;
      gap: 4px;
      padding: 2px 8px 0 0;
    }
    .caps span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ccc;
    }

    .filters {
      background: var(--card);
      padding: 0 12px 8px;
      border-bottom: 1px solid var(--line);
    }
    .scroll-h {
      display: flex;
      gap: 0;
      overflow-x: auto;
      padding: 4px 0 2px;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-h button {
      flex-shrink: 0;
      border: none;
      background: none;
      font-size: 13px;
      color: var(--sub);
      padding: 10px 14px 10px 12px;
      cursor: pointer;
      font-family: inherit;
      position: relative;
      white-space: nowrap;
    }
    .scroll-h button.on {
      color: var(--accent);
      font-weight: 600;
    }
    .scroll-h button.on::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 2px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .benefit-strip {
      margin: 0 12px 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: linear-gradient(110deg, #fff7ed 0%, #fff 50%, #fef3c7 100%);
      border: 1px solid rgba(255, 122, 69, 0.28);
      box-shadow: var(--shadow);
    }
    .benefit-strip .row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .benefit-strip .who {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .benefit-strip .who span {
      display: inline-block;
      margin-left: 8px;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: linear-gradient(90deg, #ffb347, #ff7a45);
      color: #fff;
      vertical-align: middle;
    }
    .benefit-strip .tips {
      font-size: 11px;
      color: #92400e;
      line-height: 1.55;
    }
    .tier-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .tier-row button {
      border: 1px solid rgba(255, 122, 69, 0.35);
      background: #fff;
      color: #666;
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
    }
    .tier-row button.on {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 700;
    }

    .pool-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 12px 10px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .pool-filters button {
      border: 1px solid var(--line);
      background: #fafafa;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--sub);
      cursor: pointer;
      font-family: inherit;
    }
    .pool-filters button.on {
      border-color: rgba(180, 83, 9, 0.45);
      background: #fffbeb;
      color: var(--vip-gold);
      font-weight: 700;
    }

    .cat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 10px;
      background: var(--card);
      font-size: 13px;
      color: var(--text);
      border-bottom: 1px solid var(--line);
    }
    .cat-row .dd {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--sub);
      cursor: pointer;
    }

    .nav-row2 {
      display: flex;
      justify-content: flex-end;
      padding: 0 12px 8px;
      font-size: 12px;
      gap: 10px;
    }
    .nav-extra {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .nav-extra a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .nav-extra a.dim {
      color: #888;
      font-weight: 400;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px 12px 24px;
      flex: 1;
      align-content: start;
    }
    .item {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0, 0, 0, 0.06);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      position: relative;
    }
    .item:active {
      transform: scale(0.99);
    }
    .item.has-benefit {
      border-color: rgba(255, 122, 69, 0.35);
      box-shadow: 0 4px 16px rgba(255, 122, 69, 0.12);
    }
    .corner {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      font-size: 9px;
      font-weight: 800;
      padding: 4px 6px;
      border-radius: 4px;
      line-height: 1;
      max-width: 52%;
      text-align: right;
    }
    .corner.member {
      background: linear-gradient(90deg, #ff7a45, #ea580c);
      color: #fff;
    }
    .corner.limit {
      background: #1f2937;
      color: #fde68a;
    }
    .corner.super {
      background: #5b21b6;
      color: #fff;
    }
    .ph {
      aspect-ratio: 1 / 1.05;
      background: linear-gradient(145deg, #ffe8dc, #ffd6e8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 22px 10px 10px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #7c2d12;
      line-height: 1.35;
    }
    .ph.tagline {
      background: linear-gradient(145deg, #dbeafe, #e0e7ff);
      color: #1e3a5f;
    }
    .ph.green {
      background: linear-gradient(145deg, #d8f3dc, #bbf7d0);
      color: #14532d;
    }
    .meta {
      padding: 10px 10px 12px;
    }
    .meta h4 {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.8em;
      padding-right: 2px;
    }
    .price-block {
      margin-top: 8px;
    }
    .price-guest {
      font-size: 12px;
      color: var(--sub);
      text-decoration: line-through;
      margin-bottom: 2px;
    }
    .price-guest.hide {
      display: none;
    }
    .price-member {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .price-member .lbl {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--vip-gold);
      margin-bottom: 2px;
      letter-spacing: 0;
    }
    .save-line {
      font-size: 10px;
      color: var(--ok);
      font-weight: 600;
      margin-top: 4px;
    }
    .lock-line {
      font-size: 11px;
      color: #b45309;
      margin-top: 6px;
      font-weight: 600;
    }
    .meta .stock {
      margin-top: 8px;
      font-size: 11px;
      color: var(--sub);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      background: #1f2937;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="nav-wrap">
      <div class="nav">
        <a class="back" href="m-home.html">‹</a>
        <div class="tabs-main">
          <button type="button" id="tabTask">我的任务</button>
          <button type="button" class="on" id="tabMall">积分商城</button>
        </div>
        <div class="caps" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
      <div class="nav-row2">
        <span class="nav-extra"><a href="m-home.html">权益汇总</a><a href="app-mine.html" class="dim">App 我的</a></span>
      </div>
    </header>

    <div class="filters">
      <div class="scroll-h" id="ptFilters">
        <button type="button" class="on" data-pt="all">全部</button>
        <button type="button" data-pt="1">1-1000积分</button>
        <button type="button" data-pt="2">1000-10000积分</button>
        <button type="button" data-pt="3">&gt;10000积分</button>
      </div>
    </div>

    <div class="benefit-strip">
      <div class="row1">
        <div class="who">积分商城 · 权益价预览<span id="tierBadge">6Q高级会员</span></div>
      </div>
      <p class="tips">同一商品：非会员展示「零售价」；会员按档位展示<strong>权益抵扣价</strong>。部分池为<strong>会员限定 / 超级会员加赠</strong>，与清单「积分商城权益板块」一致。</p>
      <div class="tier-row" id="tierRow">
        <button type="button" data-tier="guest">非会员（对比）</button>
        <button type="button" data-tier="base">6Q会员</button>
        <button type="button" class="on" data-tier="plus">6Q高级</button>
        <button type="button" data-tier="super">6Q超级</button>
      </div>
    </div>

    <div class="pool-filters" id="poolFilters">
      <button type="button" class="on" data-pool="all">全部商品</button>
      <button type="button" data-pool="member">会员专享价</button>
      <button type="button" data-pool="limit">限定兑换池</button>
      <button type="button" data-pool="super">超级加赠</button>
    </div>

    <div class="cat-row">
      <span style="font-weight:600;color:var(--text)">商品列表</span>
      <div class="dd" id="catDd">全部分类 <span style="font-size:10px">▼</span></div>
    </div>

    <div class="grid" id="grid"></div>
  </div>
  <div class="toast" id="toast">已加入兑换清单（原型）</div>

  <script>
    const TIER = { guest: 0, base: 1, plus: 2, super: 3 };

    const goods = [
      {
        title: "【积分专享】如何培养孩子解决问题的能力",
        guest: { pts: 1200, yuan: 1.2 },
        base: { pts: 1000, yuan: 1 },
        plus: { pts: 900, yuan: 0.9 },
        super: { pts: 800, yuan: 0.8 },
        stock: 34,
        cls: "",
        pool: "member",
        corner: "会员价",
        cornerCls: "member",
      },
      {
        title: "【积分专享】2026亲子日历",
        guest: { pts: 488, yuan: 18 },
        base: { pts: 438, yuan: 16 },
        plus: { pts: 388, yuan: 15 },
        super: { pts: 388, yuan: 12 },
        stock: 120,
        cls: "tagline",
        pool: "member",
        corner: "会员价",
        cornerCls: "member",
      },
      {
        title: "【积分专享】ADHD 家庭指南",
        guest: { pts: 1200, yuan: 1.2 },
        base: { pts: 1200, yuan: 1.2 },
        plus: { pts: 900, yuan: 0.9 },
        super: { pts: 900, yuan: 0.9 },
        stock: 8,
        cls: "green",
        pool: "limit",
        corner: "限定池",
        cornerCls: "limit",
        minTier: "plus",
      },
      {
        title: "【积分专享】女性自爱力课程",
        guest: { pts: 1200, yuan: 1.2 },
        base: { pts: 1000, yuan: 1 },
        plus: { pts: 900, yuan: 0.9 },
        super: { pts: 700, yuan: 0.7 },
        stock: 56,
        cls: "",
        pool: "member",
        corner: "会员价",
        cornerCls: "member",
      },
      {
        title: "【积分专享】情绪力训练营",
        guest: { pts: 1800, yuan: 2 },
        base: { pts: 1500, yuan: 1.5 },
        plus: { pts: 1200, yuan: 1 },
        super: { pts: 1000, yuan: 0.9 },
        stock: 22,
        cls: "tagline",
        pool: "super",
        corner: "超级加赠",
        cornerCls: "super",
        minTier: "super",
      },
      {
        title: "【积分专享】青春期沟通实战",
        guest: { pts: 2800, yuan: 3 },
        base: { pts: 2400, yuan: 2.5 },
        plus: { pts: 2000, yuan: 2 },
        super: { pts: 1600, yuan: 1.5 },
        stock: 15,
        cls: "green",
        pool: "member",
        corner: "会员价",
        cornerCls: "member",
      },
    ];

    let pt = "all";
    let pool = "all";
    let tier = "plus";

    const grid = document.getElementById("grid");
    const toast = document.getElementById("toast");
    const tierBadge = document.getElementById("tierBadge");

    const tierNames = { guest: "非会员", base: "6Q会员", plus: "6Q高级会员", super: "6Q超级会员" };

    function priceFor(g, t) {
      if (t === "guest") return g.guest;
      return g[t] || g.plus;
    }

    function inRange(g) {
      const p = priceFor(g, tier === "guest" ? "guest" : tier).pts;
      if (pt === "all") return true;
      if (pt === "1") return p >= 1 && p <= 1000;
      if (pt === "2") return p > 1000 && p <= 10000;
      if (pt === "3") return p > 10000;
      return true;
    }

    function inPool(g) {
      if (pool === "all") return true;
      if (pool === "member") return g.pool === "member";
      if (pool === "limit") return g.pool === "limit";
      if (pool === "super") return g.pool === "super";
      return true;
    }

    function canSeeBenefit(g) {
      const need = g.minTier ? TIER[g.minTier] : TIER.base;
      return TIER[tier] >= need;
    }

    function fmt(p) {
      return p.pts + "积分 + " + p.yuan + "元";
    }

    function render() {
      tierBadge.textContent = tierNames[tier];
      grid.innerHTML = "";
      goods
        .filter(inRange)
        .filter(inPool)
        .forEach((g) => {
          const guest = g.guest;
          const cur = tier === "guest" ? guest : priceFor(g, tier);
          const savePts = guest.pts - cur.pts;
          const saveYuan = +(guest.yuan - cur.yuan).toFixed(2);
          const showStrike = tier !== "guest" && (guest.pts !== cur.pts || guest.yuan !== cur.yuan);
          const locked = !canSeeBenefit(g);

          const el = document.createElement("div");
          el.className = "item" + (showStrike && !locked ? " has-benefit" : "");

          const cover = g.title.replace("【积分专享】", "").slice(0, 10) + "…";
          let priceHtml = "";
          if (tier === "guest") {
            priceHtml =
              '<div class="price-block">' +
              '<div class="price-member"><span class="lbl">零售价</span>' +
              fmt(guest) +
              "</div>" +
              '<div class="save-line" style="color:#92400e">登录会员解锁权益价</div></div>';
          } else if (locked) {
            priceHtml =
              '<div class="price-block">' +
              '<div class="price-guest">' +
              fmt(guest) +
              "</div>" +
              '<div class="lock-line">当前档位不可见权益价 · 请切换「' +
              (g.minTier === "super" ? "6Q超级" : "6Q高级") +
              "」预览</div></div>";
          } else {
            priceHtml =
              '<div class="price-block">' +
              (showStrike ? '<div class="price-guest">' + fmt(guest) + "</div>" : '<div class="price-guest hide"></div>') +
              '<div class="price-member"><span class="lbl">权益价 · ' +
              tierNames[tier] +
              "</span>" +
              fmt(cur) +
              "</div>";
            if (showStrike && (savePts > 0 || saveYuan > 0)) {
              priceHtml +=
                '<div class="save-line">已享权益 · 省 ' +
                (savePts > 0 ? savePts + " 积分" : "") +
                (savePts > 0 && saveYuan > 0 ? " · " : "") +
                (saveYuan > 0 ? "¥" + saveYuan : "") +
                "</div>";
            }
            priceHtml += "</div>";
          }

          const corner = g.corner
            ? '<div class="corner ' + (g.cornerCls || "member") + '">' + g.corner + "</div>"
            : "";

          el.innerHTML =
            corner +
            '<div class="ph ' +
            g.cls +
            '"><span style="opacity:.9;font-size:10px">【积分专享】</span><br/>' +
            cover +
            "</div>" +
            '<div class="meta"><h4>' +
            g.title +
            "</h4>" +
            priceHtml +
            '<div class="stock">剩余' +
            g.stock +
            "</div></div>";

          el.addEventListener("click", () => {
            toast.textContent = locked
              ? "当前模拟档位下不可兑 · 升级后解锁（原型）"
              : "使用「" + tierNames[tier] + "」权益价加入清单（原型）";
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 1800);
          });
          grid.appendChild(el);
        });
    }

    document.querySelectorAll("#ptFilters button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#ptFilters button").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        pt = b.dataset.pt;
        render();
      });
    });

    document.querySelectorAll("#tierRow button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#tierRow button").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        tier = b.dataset.tier;
        render();
      });
    });

    document.querySelectorAll("#poolFilters button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#poolFilters button").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        pool = b.dataset.pool;
        render();
      });
    });

    document.getElementById("tabTask").addEventListener("click", () => {
      document.getElementById("tabTask").classList.add("on");
      document.getElementById("tabMall").classList.remove("on");
      alert("原型：我的任务页未搭建，当前为积分商城演示。");
      document.getElementById("tabTask").classList.remove("on");
      document.getElementById("tabMall").classList.add("on");
    });
    document.getElementById("tabMall").addEventListener("click", () => {
      document.getElementById("tabMall").classList.add("on");
      document.getElementById("tabTask").classList.remove("on");
    });

    document.getElementById("catDd").addEventListener("click", () => {
      alert("原型：全部分类下拉");
    });

    render();
  </script>
</body>
</html>
