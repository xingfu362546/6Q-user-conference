<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台 · 兑换码生成</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f1f5f9; --card:#fff; --text:#0f172a; --sub:#64748b; --pri:#4f46e5; --line:#e2e8f0; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--text)}
    header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
    header h1{font-size:18px}
    header a{color:var(--pri);text-decoration:none;font-size:14px}
    main{max-width:900px;margin:0 auto;padding:20px 24px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:700px){.row{grid-template-columns:1fr}}
    label{display:block;font-size:13px;margin-bottom:6px;font-weight:500}
    input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);font-family:inherit}
    button{padding:10px 18px;border-radius:8px;border:none;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;font-family:inherit}
    textarea{width:100%;min-height:120px;margin-top:12px;padding:10px;border-radius:8px;border:1px solid var(--line);font-family:monospace;font-size:12px}
    .log{font-size:13px;color:var(--sub);margin-top:8px}
  </style>
</head>
<body>
  <header>
    <h1>权益兑换码生成</h1>
    <a href="index.html">← 原型导航</a>
  </header>
  <main>
    <div class="card">
      <div class="row">
        <div><label>绑定权益包</label><select id="pack"><option>6Q 会员 · 月卡</option><option>6Q 高级会员 · 年卡</option><option>AI 数字人 · 3 次包</option></select></div>
        <div><label>生成数量</label><input type="number" id="cnt" value="5" min="1" max="500" /></div>
      </div>
      <p class="log">清单：支持批量生成兑换码；下方为前端随机模拟，非真实码。</p>
      <button type="button" id="gen" style="margin-top:14px">生成</button>
    </div>
    <div class="card">
      <label>结果（可复制）</label>
      <textarea id="out" readonly placeholder="点击生成后出现"></textarea>
    </div>
  </main>
  <script>
    document.getElementById('gen').addEventListener('click', () => {
      const n = Math.min(500, Math.max(1, +document.getElementById('cnt').value || 5));
      const lines = [];
      for (let i = 0; i < n; i++) {
        const s = Array.from({length:16},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
        lines.push(s.match(/.{1,4}/g).join('-'));
      }
      document.getElementById('out').value = lines.join('\n');
    });
  </script>
</body>
</html>
