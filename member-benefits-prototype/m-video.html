<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>短视频</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #000;
      --bar: rgba(0, 0, 0, 0.55);
      --text: #fff;
      --muted: rgba(255, 255, 255, 0.72);
      --accent: #ff7a45;
      --sheet: #fff;
      --line: #f0f0f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: #555;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 10px 32px;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      background: var(--black);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      color: var(--text);
      min-height: 720px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 8px;
      background: var(--black);
      flex-shrink: 0;
    }
    .topbar a.back {
      color: #fff;
      text-decoration: none;
      font-size: 26px;
      line-height: 1;
      padding: 4px 8px 4px 0;
      font-weight: 300;
    }
    .top-actions {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      flex: 1;
      justify-content: center;
      padding-right: 8px;
    }
    .ta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--muted);
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      padding: 0;
    }
    .ta .ico {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .ta:active .ico { background: rgba(255, 255, 255, 0.18); }
    .wx-cap {
      display: flex;
      gap: 6px;
      align-items: center;
      padding-left: 4px;
    }
    .wx-cap span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
    }
    .wx-cap span:nth-child(2) {
      width: 14px;
      height: 5px;
      border-radius: 3px;
    }

    .vip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px 8px;
      font-size: 11px;
      color: var(--muted);
      background: var(--black);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .toggle {
      width: 44px;
      height: 26px;
      border-radius: 999px;
      background: #374151;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toggle.on { background: #22c55e; }
    .toggle::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      top: 2px;
      left: 2px;
      transition: left 0.2s;
    }
    .toggle.on::after { left: 20px; }

    .player-wrap {
      flex: 1;
      min-height: 280px;
      position: relative;
      background: #0a0a0a;
    }
    .player {
      width: 100%;
      aspect-ratio: 16 / 11;
      max-height: 52vh;
      background: linear-gradient(160deg, #1a1a2e 0%, #0f0f18 50%, #16213e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .brand {
      text-align: center;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg, #ff9a56, #ff6b9d, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand small {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 8px;
      letter-spacing: 0.2em;
    }
    .play-btn {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.85);
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding-left: 4px;
    }
    .lock-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(251, 191, 36, 0.95);
      color: #422006;
    }
    .lock-tag.free {
      background: rgba(34, 197, 94, 0.95);
      color: #052e16;
    }

    .info-block {
      padding: 12px 14px 10px;
      background: var(--black);
    }
    .author-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .author-row .av {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #93c5fd, #6366f1);
      flex-shrink: 0;
    }
    .author-row .name { font-size: 15px; font-weight: 600; flex: 1; }
    .author-row .plays {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .desc {
      font-size: 14px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.92);
      margin-bottom: 10px;
    }
    .progress {
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      position: relative;
      margin-bottom: 12px;
    }
    .progress i {
      position: absolute;
      left: 22%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.3);
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0));
      background: var(--black);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .comment-ph {
      flex: 1;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      border: none;
      text-align: left;
      font-family: inherit;
    }
    .actions {
      display: flex;
      gap: 16px;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
    }
    .actions b {
      display: block;
      text-align: center;
      font-size: 16px;
      margin-bottom: 2px;
      opacity: 0.95;
      font-weight: 400;
    }
    .actions > div {
      cursor: pointer;
      user-select: none;
    }
    .actions > div:active { opacity: 0.7; }

    .nav-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(20, 20, 20, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 12px;
    }
    .nav-foot a {
      color: #fcd34d;
      text-decoration: none;
      font-weight: 600;
    }
    .nav-foot a.dim {
      color: #94a3b8;
      font-weight: 400;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.show { display: flex; }
    .sheet {
      width: 100%;
      max-width: 390px;
      max-height: 68vh;
      background: var(--sheet);
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      animation: up 0.28s ease;
    }
    @keyframes up {
      from {
        transform: translateY(24px);
        opacity: 0.85;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .sheet-head h2 {
      font-size: 16px;
      font-weight: 600;
      color: #111;
      flex: 1;
      text-align: center;
    }
    .sheet-head .x {
      border: none;
      background: none;
      font-size: 22px;
      color: #999;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }
    .sheet-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px 12px;
    }
    .cmt {
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .cmt-top {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .cmt .av {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e5e5e5;
      flex-shrink: 0;
    }
    .cmt .body { flex: 1; min-width: 0; }
    .cmt .row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .cmt .uname {
      font-size: 14px;
      font-weight: 600;
      color: #111;
    }
    .cmt .uname.member { color: var(--accent); }
    .cmt .more {
      color: #bbb;
      font-size: 18px;
      line-height: 1;
      padding: 0 4px;
    }
    .cmt .txt {
      font-size: 14px;
      color: #333;
      line-height: 1.5;
      margin-top: 6px;
    }
    .cmt .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      font-size: 12px;
      color: #999;
    }
    .cmt .meta button {
      border: none;
      background: none;
      color: #666;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }
    .sheet-input {
      padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0));
      border-top: 1px solid var(--line);
      background: #fafafa;
    }
    .sheet-input input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid #e5e5e5;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
    }
    .toast-purchased {
      position: fixed;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .toast-purchased.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <header class="topbar">
      <a class="back" href="m-home.html">‹</a>
      <div class="top-actions">
        <button type="button" class="ta" id="btnShare"><span class="ico">↗</span>转发</button>
        <button type="button" class="ta" id="btnPurchased"><span class="ico">▶</span>已购视频</button>
        <button type="button" class="ta" id="btnAi"><span class="ico">AI</span>视频助手</button>
      </div>
      <div class="wx-cap" aria-hidden="true"><span></span><span></span><span></span></div>
    </header>

    <div class="vip-row">
      <span>权益观看：<strong id="vipLabel">已开通</strong> · 付费内容示意</span>
      <div class="toggle on" id="vipToggle" title="切换权益"></div>
    </div>

    <div class="player-wrap">
      <div class="player">
        <div>
          <div class="brand">6Q教育<small>SHORT VIDEO</small></div>
        </div>
        <span class="lock-tag free" id="lockTag">权益免费看</span>
        <button type="button" class="play-btn" aria-label="播放">▶</button>
      </div>
    </div>

    <div class="info-block">
      <div class="author-row">
        <div class="av" aria-hidden="true"></div>
        <span class="name">6Q汤爱武</span>
        <span class="plays">▶ 1008播放</span>
      </div>
      <p class="desc">阅读点亮人生，书香浸润家庭</p>
      <div class="progress"><i></i></div>
    </div>

    <div class="bottom-bar">
      <button type="button" class="comment-ph" id="openComments">友善评论~</button>
      <div class="actions">
        <div><b>♡</b>24</div>
        <div><b>☆</b>12</div>
        <div id="openComments2"><b>💬</b>5</div>
      </div>
    </div>

    <div class="nav-foot">
      <a href="m-home.html">‹ 权益汇总</a>
      <span>
        <a href="app-home.html" class="dim">首页</a>
        <span style="color:#444;margin:0 6px">·</span>
        <a href="app-mine.html" class="dim">我的</a>
      </span>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <span style="width:36px"></span>
        <h2 id="sheetTitle">5条评论</h2>
        <button type="button" class="x" id="closeSheet" aria-label="关闭">×</button>
      </div>
      <div class="sheet-list">
        <div class="cmt">
          <div class="cmt-top">
            <div class="av"></div>
            <div class="body">
              <div class="row1">
                <span class="uname member">会员9087</span>
                <span class="more">⋯</span>
              </div>
              <p class="txt">会员昵称前缀示意；可扩展为档位角标。</p>
              <div class="meta">
                <span>2026-05-07 14:20</span><span>广东</span><button type="button">回复</button><span>👍 0</span>
              </div>
            </div>
          </div>
        </div>
        <div class="cmt">
          <div class="cmt-top">
            <div class="av" style="background:linear-gradient(135deg,#fca5a5,#f87171)"></div>
            <div class="body">
              <div class="row1">
                <span class="uname">用户_3362</span>
                <span class="more">⋯</span>
              </div>
              <p class="txt">播放略卡，希望优化一下加载。</p>
              <div class="meta">
                <span>2026-05-06 09:12</span><span>江苏</span><button type="button">回复</button><span>👍 2</span>
              </div>
            </div>
          </div>
        </div>
        <div class="cmt">
          <div class="cmt-top">
            <div class="av" style="background:linear-gradient(135deg,#86efac,#22c55e)"></div>
            <div class="body">
              <div class="row1">
                <span class="uname">普通访客</span>
                <span class="more">⋯</span>
              </div>
              <p class="txt">无会员前缀时的展示样式。</p>
              <div class="meta">
                <span>2026-05-05 18:00</span><span>浙江</span><button type="button">回复</button><span>👍 0</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="sheet-input">
        <input type="text" readonly placeholder="这里是评论区 ~" />
      </div>
    </div>
  </div>

  <div class="toast-purchased" id="toastPurchased">进入「已购 / 权益可看」列表（原型）</div>

  <script>
    const overlay = document.getElementById("overlay");
    const closeSheet = document.getElementById("closeSheet");
    const sheet = document.getElementById("sheet");
    function openSheet() {
      overlay.classList.add("show");
    }
    function closeSheetFn() {
      overlay.classList.remove("show");
    }
    document.getElementById("openComments").addEventListener("click", openSheet);
    document.getElementById("openComments2").addEventListener("click", openSheet);
    closeSheet.addEventListener("click", closeSheetFn);
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeSheetFn();
    });
    sheet.addEventListener("click", (e) => e.stopPropagation());

    const vipToggle = document.getElementById("vipToggle");
    const lockTag = document.getElementById("lockTag");
    const vipLabel = document.getElementById("vipLabel");
    let vipOn = true;
    vipToggle.addEventListener("click", () => {
      vipOn = !vipOn;
      vipToggle.classList.toggle("on", vipOn);
      if (vipOn) {
        lockTag.textContent = "权益免费看";
        lockTag.className = "lock-tag free";
        vipLabel.textContent = "已开通";
      } else {
        lockTag.textContent = "付费 ¥3";
        lockTag.className = "lock-tag";
        vipLabel.textContent = "未开通";
      }
    });

    const toastP = document.getElementById("toastPurchased");
    document.getElementById("btnPurchased").addEventListener("click", () => {
      toastP.classList.add("show");
      setTimeout(() => toastP.classList.remove("show"), 1600);
    });
    document.getElementById("btnShare").addEventListener("click", () => {
      alert("原型：转发面板");
    });
    document.getElementById("btnAi").addEventListener("click", () => {
      alert("原型：视频助手");
    });
  </script>
</body>
</html>
